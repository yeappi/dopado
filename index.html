<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DOPAON TASK SYSTEM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Reggae+One&family=Orbitron:wght@700;900&display=swap');
:root{--kb:0px;--safe:env(safe-area-inset-bottom,0px);--input-h:58px;--habit-h:100px;--header-h:46px;--bottom-ui:calc(var(--input-h) + var(--habit-h));}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#020208;overflow:hidden;font-family:system-ui,sans-serif;}
body{touch-action:manipulation;}
#sf8{position:fixed;inset:0;margin:0 auto;width:100%;max-width:430px;height:100dvh;background:#07070f;color:#c8d8f0;overflow:hidden;border-left:1px solid #1e1e38;border-right:1px solid #1e1e38;}
.header{position:absolute;top:0;left:0;right:0;z-index:20;height:var(--header-h);display:flex;align-items:center;padding:0 16px;gap:8px;background:#07070f;border-bottom:1px solid #1e1e38;}
.logo{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;letter-spacing:3px;color:#00ffcc;}
.sub{font-family:'Orbitron',monospace;font-size:7px;color:#00ffcc44;letter-spacing:4px;margin-top:2px}
.online{margin-left:auto;display:flex;align-items:center;gap:5px}
.online-dot{width:6px;height:6px;border-radius:50%;background:#39ff14}
.online-txt{font-family:'Orbitron',monospace;font-size:7px;color:#39ff14;letter-spacing:2px}
#ta{position:absolute;top:var(--header-h);bottom:calc(var(--bottom-ui) + var(--kb) + var(--safe));left:0;right:0;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;transition:bottom .18s ease-out;}
#pc{position:absolute;top:var(--header-h);bottom:calc(var(--bottom-ui) + var(--kb) + var(--safe));left:0;right:0;pointer-events:none;overflow:hidden;z-index:15;transform:translateZ(0);transition:bottom .18s ease-out;}
#habitRow{position:absolute;left:0;right:0;bottom:calc(var(--input-h) + var(--kb) + var(--safe));height:var(--habit-h);z-index:18;border-top:1px solid #1e1e38;display:flex;background:#07070f;transition:bottom .18s ease-out;}
#inputBar{position:absolute;left:0;right:0;bottom:calc(var(--kb) + var(--safe));height:calc(var(--input-h) + var(--safe));padding:0 12px var(--safe);z-index:30;border-top:1px solid #1e1e38;background:#07070f;display:flex;align-items:center;gap:10px;transition:bottom .18s ease-out;}
#mi{flex:1;height:38px;min-width:0;border:1px solid #1e1e38;border-radius:19px;background:#0f0f20;padding:0 14px;font-size:16px;color:#c8d8f0;font-family:system-ui,sans-serif;letter-spacing:.5px;}
#mi::placeholder{color:#2a3a55}
#mi:focus{outline:none}
.roundBtn{width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:18px;line-height:1}
.bolt{border:1.5px solid #2a2a50;background:transparent;color:#6070a0}
.dopa{border:none;background:#c8a020;color:#07070f;opacity:.4}
.habit-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px;gap:10px;overflow:hidden}
.habit-title{font-size:14px;color:#ddeeff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-status{display:flex;gap:7px;align-items:center}
.dot-on,.dot-off{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-on{background:#00ffcc}
.dot-off{background:transparent;border:1.5px solid #2a3a55}
.counter{font-family:'Orbitron',monospace;font-size:8px;color:#4a6080;margin-left:4px;letter-spacing:1px}
.meter{width:100px;height:100px;border-left:1px solid #1e1e38;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{text-align:center;padding:80px 20px;color:#2a3a55}
.empty-icon{font-size:24px;margin-bottom:10px}
.empty-text{font-size:14px}
.task{background:#0f0f20;border:1px solid #1e1e38;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.task.charging{border-color:#ffd700}
.task.done{opacity:.35}
.task-name{flex:1;font-size:14px;line-height:1.4;color:#c8d8f0}
.task.done .task-name{color:#3a4060;text-decoration:line-through}
.task-action{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.task-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid #2a2a50;background:transparent;color:#3a3a65;cursor:pointer;display:flex;align-items:center;justify-content:center}
.task.charging .task-btn{border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700}
.push{font-family:'Orbitron',monospace;font-size:7px;color:#ffd700;letter-spacing:.5px}
.done-mark{font-size:16px;color:#39ff14;flex-shrink:0}
.completed{margin-top:12px;padding-top:10px;border-top:1px solid #111122}
.completed p{font-family:'Orbitron',monospace;font-size:8px;color:#2a3a55;letter-spacing:2px;margin:0 0 8px}
.dream{position:absolute;bottom:calc(var(--bottom-ui) + var(--kb) + var(--safe) + 8px);left:12px;right:12px;background:#0f0f20;border:1px solid #1e1e38;border-left:3px solid #c8a020;border-radius:10px;padding:12px 16px;font-size:13px;color:#ddeeff;font-weight:500;text-align:center;line-height:1.8;z-index:40;pointer-events:none;transition:bottom .18s ease-out;}
@keyframes tslide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.5}}
.tnew{animation:tslide .2s ease-out}
.cbtn{animation:cpulse 1s ease-in-out infinite}
</style>
</head>
<body>
<div id="sf8">
  <div id="pc"></div>

  <div class="header">
    <span class="logo">DOPAON</span>
    <span class="sub">TASK SYSTEM</span>
    <div class="online">
      <span class="online-dot"></span>
      <span class="online-txt">ONLINE</span>
    </div>
  </div>

  <div id="ta"></div>

  <div id="habitRow">
    <div class="habit-main">
      <span class="habit-title">パチスロをしない</span>
      <div class="habit-status">
        <span class="dot-on"></span>
        <span class="dot-off"></span>
        <span class="dot-off"></span>
        <span class="counter">1/3</span>
        <span style="font-size:13px;color:#3a5070;margin-left:auto;">›</span>
      </div>
    </div>

    <div class="meter">
      <svg width="82" height="82" viewBox="0 0 82 82" aria-hidden="true">
        <circle cx="41" cy="41" r="36" fill="none" stroke="#181830" stroke-width="5" stroke-dasharray="3.5 2.2"/>
        <circle cx="41" cy="41" r="36" fill="none" stroke="#39ff14" stroke-width="5" stroke-dasharray="143 83" transform="rotate(-90 41 41)"/>
        <circle cx="41" cy="41" r="28" fill="#0e0e1c" stroke="#252545" stroke-width="1.5"/>
        <circle cx="41" cy="41" r="24" fill="#06060e"/>
        <line x1="31" y1="31" x2="35" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="31" y1="31" x2="31" y2="35" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="51" y1="31" x2="47" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="51" y1="31" x2="51" y2="35" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="31" y1="51" x2="35" y2="51" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="31" y1="51" x2="31" y2="47" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="51" y1="51" x2="47" y2="51" stroke="#00ffcc" stroke-width="1.5"/>
        <line x1="51" y1="51" x2="51" y2="47" stroke="#00ffcc" stroke-width="1.5"/>
        <text x="41" y="39" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00ffcc">DO</text>
        <text x="41" y="50" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00ffcc" opacity=".7">DO!!</text>
      </svg>
    </div>
  </div>

  <div id="inputBar">
    <button id="ib" class="roundBtn bolt" onclick="doInst()" aria-label="即タスク化">⚡</button>
    <input
      id="mi"
      type="text"
      placeholder="タスクを入力..."
      autocomplete="off"
      enterkeyhint="done"
      oninput="onIn(event)"
      onkeydown="onKey(event)"
      oncompositionstart="onCompStart()"
      oncompositionend="onCompEnd()"
      onfocus="onInputFocus()"
    />
    <button id="db" class="roundBtn dopa" onclick="doDopa()" aria-label="DOPAON!">✦</button>
  </div>
</div>

<script>
const DREAM=[
  "その一歩が、すべての始まり。",
  "お前の夢は、まだ死んでいない。",
  "やった奴だけが、手に入れる。",
  "迷ってる暇があるなら、動け。",
  "今日のお前が、明日を決める。",
  "成功した奴は、ただやり続けた。",
  "限界は、脳が作る幻想だ。",
  "積み上げた先が、お前の帝国になる。"
];

const PR=[
  {t:"えらい！",c:"#00ffcc"},
  {t:"最高！！",c:"#39ff14"},
  {t:"天才！！",c:"#ffd700"},
  {t:"すごい！！",c:"#00ff99"},
  {t:"神！！！",c:"#ff3366"},
  {t:"無敵！！",c:"#ffd700"},
  {t:"できる！！",c:"#00ffcc"},
  {t:"やばい！！",c:"#ff8c00"},
  {t:"完璧！！",c:"#ffd700"},
  {t:"キュン！",c:"#66ccff"}
];

const ADD_PR=[
  {t:"よし！！",c:"#00ffcc"},
  {t:"起動！！",c:"#39ff14"},
  {t:"いいね！！",c:"#ffd700"}
];

const DONE_PR=[
  {t:"完了！！",c:"#ffd700"},
  {t:"確定！！",c:"#ff3366"},
  {t:"神！！！",c:"#ffd700"}
];

let tasks=[];
let isComposing=false;
let lastPraiseLen=0;
let lastPraiseAt=0;
let livePraise=0;
let busyLanes=new Set();
let activePraise=new Set();

const NS="http://www.w3.org/2000/svg";
const FF="'Reggae One', system-ui, sans-serif";
const PRAISE_STEP=3;
const PRAISE_LIFE=2000;
const MAX_PRAISE=3;
const PRAISE_COOLDOWN=350;
const P_MARGIN=10;

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}
function charLen(t){return Array.from(t).length}
function vl(){return document.getElementById("mi").value.trim()}
function newId(){return window.crypto&&typeof window.crypto.randomUUID==="function"?window.crypto.randomUUID():String(Date.now())+"_"+String(Math.random()).slice(2)}
function isSideMark(ch){return /[！!？?‼⁉⁈♡♥❤★☆♪♫♬〜ー…‥・。、,.，．]/.test(ch)}

function grps(txt){
  const cs=Array.from(txt),gs=[];
  let i=0;
  while(i<cs.length){
    if(isSideMark(cs[i])){
      let j=i;
      while(j<cs.length&&isSideMark(cs[j]))j++;
      gs.push({side:true,t:cs.slice(i,j).join("")});
      i=j;
    }else{
      gs.push({side:false,t:cs[i]});
      i++;
    }
  }
  return gs;
}

function textSize(mode){
  if(mode==="done")return 26+Math.floor(Math.random()*7);
  if(mode==="add")return 22+Math.floor(Math.random()*7);
  return 17+Math.floor(Math.random()*8);
}

function getTextBox(groups,fs){
  const pad=Math.ceil(fs*.55),lh=Math.ceil(fs*1.34);
  const maxMark=groups.reduce((m,g)=>g.side?Math.max(m,Array.from(g.t).length):m,1);
  return{
    w:Math.ceil(Math.max(fs,maxMark*fs*.62)+pad*2),
    h:Math.ceil(groups.length*lh+pad),
    pad,
    lh
  };
}

function txPair(svg,x,y,fs,txt,col){
  const outer=Math.max(4,fs*.24),inner=Math.max(2,fs*.11);
  [["none","white",outer],[col,"#111",inner]].forEach(([fill,stroke,sw])=>{
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",x);
    t.setAttribute("y",y);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.setAttribute("font-family",FF);
    t.setAttribute("font-size",fs);
    t.setAttribute("font-weight","900");
    t.setAttribute("fill",fill);
    t.setAttribute("stroke",stroke);
    t.setAttribute("stroke-width",sw);
    t.setAttribute("stroke-linejoin","round");
    if(fill!=="none")t.setAttribute("paint-order","stroke");
    t.textContent=txt;
    svg.appendChild(t);
  });
}

function drawPraiseText(svg,item,groups,box,fs){
  let cy=box.pad/2+box.lh/2;
  groups.forEach(g=>{
    const len=Math.max(1,Array.from(g.t).length);
    const fitFs=g.side?Math.min(fs,Math.max(10,(box.w-box.pad*.65)/(len*.62))):fs;
    txPair(svg,box.w/2,cy,fitFs,g.t,item.c);
    cy+=box.lh;
  });
}

function keyboardInset(){
  const vv=window.visualViewport;
  if(!vv)return 0;
  return Math.max(0,Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
}

function syncLineLikeLayout(){
  document.documentElement.style.setProperty("--kb",keyboardInset()+"px");
}

function onInputFocus(){
  setTimeout(()=>{
    syncLineLikeLayout();
    document.getElementById("mi").scrollIntoView({block:"nearest"});
  },60);
  setTimeout(syncLineLikeLayout,260);
}

function getPraiseOrigin(){
  const pc=document.getElementById("pc"),bar=document.getElementById("inputBar");
  if(!pc||!bar)return{x:180,y:360};
  const pcRect=pc.getBoundingClientRect(),barRect=bar.getBoundingClientRect();
  return{
    x:clamp(barRect.left+barRect.width/2-pcRect.left,48,pc.clientWidth-48),
    y:clamp(barRect.top-pcRect.top+10,pc.clientHeight*.55,pc.clientHeight+86)
  };
}

function getLanes(origin){
  const pc=document.getElementById("pc"),count=pc.clientWidth<360?5:7,topY=18,minX=38,maxX=pc.clientWidth-38,lanes=[];
  for(let i=0;i<count;i++){
    const targetX=count===1?pc.clientWidth/2:minX+(maxX-minX)*(i/(count-1));
    const dx=targetX-origin.x,dy=topY-origin.y;
    const angle=Math.atan2(dy,dx)*180/Math.PI,len=Math.hypot(dx,dy);
    lanes.push({index:i,angle,len});
  }
  return lanes;
}

function getPointOnLane(origin,lane,d){
  const r=lane.angle*Math.PI/180;
  return{x:origin.x+Math.cos(r)*d,y:origin.y+Math.sin(r)*d};
}

function fitsInPraiseArea(x,y,w,h){
  const pc=document.getElementById("pc");
  return x-w/2>P_MARGIN&&x+w/2<pc.clientWidth-P_MARGIN&&y-h/2>P_MARGIN&&y+h/2<pc.clientHeight-P_MARGIN;
}

function pickPraisePosition(w,h){
  const pc=document.getElementById("pc"),origin=getPraiseOrigin(),lanes=getLanes(origin);
  const free=lanes.filter(l=>!busyLanes.has(l.index)),pool=shuffle(free.length?free:lanes);

  for(const lane of pool){
    const minD=88,maxD=Math.max(minD+20,Math.min(lane.len-54,340));
    for(let i=0;i<9;i++){
      const d=minD+Math.random()*(maxD-minD),p=getPointOnLane(origin,lane,d);
      if(fitsInPraiseArea(p.x,p.y,w,h))return{lane,x:p.x,y:p.y,angle:lane.angle};
    }
  }

  const fallbackLane=pool[0]||lanes[0]||{index:0,angle:-90};
  const p=getPointOnLane(origin,fallbackLane,150);
  return{
    lane:fallbackLane,
    x:clamp(p.x,w/2+P_MARGIN,pc.clientWidth-w/2-P_MARGIN),
    y:clamp(p.y,h/2+P_MARGIN,pc.clientHeight-h/2-P_MARGIN),
    angle:fallbackLane.angle
  };
}

function spawnPraise(mode="input",forcedItem=null){
  if(livePraise>=MAX_PRAISE)return;
  syncLineLikeLayout();

  const pc=document.getElementById("pc");
  if(!pc)return;

  const item=forcedItem||rand(mode==="done"?DONE_PR:mode==="add"?ADD_PR:PR);
  const groups=grps(item.t);
  const fs=textSize(mode);
  const box=getTextBox(groups,fs);
  const pos=pickPraisePosition(box.w,box.h);
  const rot=clamp(pos.angle+90,-34,34);

  busyLanes.add(pos.lane.index);
  livePraise++;

  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",box.w);
  svg.setAttribute("height",box.h);
  svg.setAttribute("viewBox","0 0 "+box.w+" "+box.h);
  svg.style.cssText=
    "position:absolute;left:"+(pos.x-box.w/2).toFixed(1)+"px;top:"+(pos.y-box.h/2).toFixed(1)+"px;transform:rotate("+rot.toFixed(1)+"deg) scale(.96);opacity:0;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));";

  drawPraiseText(svg,item,groups,box,fs);
  pc.appendChild(svg);
  activePraise.add(svg);

  const scale=mode==="input"?1:1.06;
  const anim=svg.animate(
    [
      {opacity:0,transform:"rotate("+rot.toFixed(1)+"deg) translateY(8px) scale(.9)"},
      {opacity:1,transform:"rotate("+rot.toFixed(1)+"deg) translateY(0) scale("+scale+")",offset:.12},
      {opacity:1,transform:"rotate("+rot.toFixed(1)+"deg) translateY(-8px) scale(1)",offset:.78},
      {opacity:0,transform:"rotate("+rot.toFixed(1)+"deg) translateY(-18px) scale(.96)"}
    ],
    {duration:PRAISE_LIFE,easing:"cubic-bezier(.18,.8,.22,1)",fill:"forwards"}
  );
  anim.onfinish=()=>releasePraise(svg,pos.lane.index);
}

function releasePraise(svg,laneIndex){
  if(!activePraise.has(svg))return;
  activePraise.delete(svg);
  busyLanes.delete(laneIndex);
  livePraise=Math.max(0,livePraise-1);
  if(svg.parentNode)svg.parentNode.removeChild(svg);
}

function clearPraise(){
  const pc=document.getElementById("pc");
  if(!pc)return;
  pc.innerHTML="";
  activePraise.clear();
  busyLanes.clear();
  livePraise=0;
}

function updateInputButtons(v){
  const db=document.getElementById("db"),ib=document.getElementById("ib");
  db.style.opacity=v?"1":".4";
  ib.style.color=v?"#00ffcc":"#6070a0";
  ib.style.borderColor=v?"#00ffcc55":"#2a2a50";
}

function resetPraiseInput(){
  lastPraiseLen=0;
  lastPraiseAt=0;
}

function onCompStart(){isComposing=true}
function onCompEnd(){isComposing=false;onIn()}

function onIn(e){
  syncLineLikeLayout();

  const v=vl();
  updateInputButtons(v);

  if(!v){
    resetPraiseInput();
    return;
  }

  if(isComposing||(e&&e.isComposing))return;

  const len=charLen(v),now=Date.now();

  if(len<lastPraiseLen){
    lastPraiseLen=len;
    return;
  }

  if(len-lastPraiseLen>=PRAISE_STEP&&now-lastPraiseAt>=PRAISE_COOLDOWN){
    spawnPraise("input");
    lastPraiseLen=len;
    lastPraiseAt=now;
  }
}

function onKey(e){
  if(e.key==="Enter"&&!isComposing){
    e.preventDefault();
    doInst();
  }
}

function doInst(){
  const v=vl();
  if(v)addT(v,"add");
}

function doDopa(){
  const v=vl();
  if(!v)return;

  const el=document.createElement("div");
  el.className="dream";
  el.textContent=rand(DREAM);
  document.getElementById("sf8").appendChild(el);

  el.animate(
    [
      {opacity:0,transform:"translateY(6px)"},
      {opacity:1,transform:"translateY(0)",offset:.1},
      {opacity:1,offset:.8},
      {opacity:0}
    ],
    {duration:2800,fill:"forwards"}
  ).onfinish=()=>{
    if(el.parentNode)el.parentNode.removeChild(el);
  };

  addT(v,"add");
}

function addT(name,praiseMode){
  tasks.unshift({id:newId(),name,state:"idle"});
  document.getElementById("mi").value="";
  updateInputButtons("");
  resetPraiseInput();
  render();
  document.getElementById("ta").scrollTop=0;

  if(praiseMode)setTimeout(()=>spawnPraise(praiseMode),80);
}

function tap(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;

  if(t.state==="idle"){
    t.state="charging";
  }else if(t.state==="charging"){
    t.state="done";
    setTimeout(()=>spawnPraise("done"),80);
  }

  render();
}

function render(){
  const a=document.getElementById("ta");
  a.innerHTML="";

  if(!tasks.length){
    a.innerHTML='<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">タスクを入力して追加しよう</div></div>';
    return;
  }

  const act=tasks.filter(t=>t.state!=="done");
  const done=tasks.filter(t=>t.state==="done");

  act.forEach((t,i)=>{
    const c=mkC(t);
    if(i===0)c.classList.add("tnew");
    a.appendChild(c);
  });

  if(done.length){
    const s=document.createElement("div");
    s.className="completed";
    s.innerHTML="<p>COMPLETED "+done.length+"</p>";
    a.appendChild(s);
    done.forEach(t=>a.appendChild(mkC(t)));
  }
}

function mkC(task){
  const iC=task.state==="charging",iD=task.state==="done";
  const el=document.createElement("div");
  el.className="task"+(iC?" charging":"")+(iD?" done":"");

  const nm=document.createElement("span");
  nm.className="task-name";
  nm.textContent=task.name;
  el.appendChild(nm);

  if(!iD){
    const w=document.createElement("div");
    w.className="task-action";

    const b=document.createElement("button");
    b.className="task-btn"+(iC?" cbtn":"");
    b.onclick=()=>tap(task.id);
    b.setAttribute("aria-label",iC?"完了確定":"チャージ開始");
    b.innerHTML=iC
      ? '<span style="font-family:\'Orbitron\',monospace;font-size:7px;font-weight:700;">確定</span>'
      : '<span style="font-size:17px;">✓</span>';

    w.appendChild(b);

    if(iC){
      const h=document.createElement("span");
      h.className="push";
      h.textContent="PUSH";
      w.appendChild(h);
    }

    el.appendChild(w);
  }else{
    const ic=document.createElement("span");
    ic.className="done-mark";
    ic.textContent="✓";
    el.appendChild(ic);
  }

  return el;
}

function handleViewportChange(){
  syncLineLikeLayout();
  clearPraise();
}

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",handleViewportChange);
  window.visualViewport.addEventListener("scroll",handleViewportChange);
}

window.addEventListener("resize",syncLineLikeLayout);
window.addEventListener("orientationchange",()=>setTimeout(syncLineLikeLayout,250));

syncLineLikeLayout();
render();
</script>
</body>
</html>
