<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="theme-color" content="#07070f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DOPAON" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest?v=3" />
<link rel="apple-touch-icon" href="./icon.png?v=3" />

<title>DOPAON TASK SYSTEM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Reggae+One&family=Orbitron:wght@700;900&display=swap');

:root{
  --app-top:0px;
  --app-h:100vh;
  --kb:0px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:60px;
  --dock-h:158px;
  --input-h:58px;
  --habit-h:100px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#020208;
  font-family:system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none;
}
body{position:fixed;inset:0;touch-action:manipulation}
#sf8{
  position:fixed;top:var(--app-top);left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:var(--app-h);background:#07070f;color:#c8d8f0;
  overflow:hidden;border-left:1px solid #1e1e38;border-right:1px solid #1e1e38;
}
.header{
  position:absolute;top:0;left:0;right:0;z-index:30;
  height:calc(var(--safe-top) + var(--header-h));padding:var(--safe-top) 12px 0 14px;
  display:flex;align-items:center;gap:10px;background:#07070f;border-bottom:1px solid #1e1e38;
}
.brand{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.logo{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:2.5px;color:#00ffcc;line-height:1}
.sub{font-family:'Orbitron',monospace;font-size:6px;color:#00ffcc44;letter-spacing:3px}
.identity{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;cursor:pointer;padding:6px 4px;border-radius:10px;transition:background .15s}
.identity:active{background:#0f0f20}
.id-text{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.id-name{font-size:13px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.id-name .ttl{font-weight:500}
.id-lv{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:#4a6080;display:flex;align-items:center;gap:5px}
.id-lv b{color:#ffd24a;font-weight:700}.id-lv .free{color:#00ffcc}
.id-avatar{width:34px;height:34px;border-radius:50%;border:1.5px solid #2a2a50;background:#0f0f20;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
#ta{position:absolute;top:calc(var(--safe-top) + var(--header-h));bottom:calc(var(--dock-h) + var(--safe-bottom));left:0;right:0;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;z-index:5}
#pc{position:absolute;top:calc(var(--safe-top) + var(--header-h));bottom:0;left:0;right:0;pointer-events:none;overflow:hidden;z-index:40;transform:translateZ(0)}
#bottomDock{position:absolute;left:0;right:0;bottom:0;height:calc(var(--dock-h) + var(--safe-bottom));z-index:35;transform:translate3d(0,calc(var(--kb) * -1),0);transition:transform .18s ease-out;will-change:transform;background:#07070f}
#habitRow{position:absolute;top:0;left:0;right:0;height:var(--habit-h);border-top:1px solid #1e1e38;display:flex;background:#07070f}
#inputBar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--input-h) + var(--safe-bottom));padding:8px 12px calc(8px + var(--safe-bottom));border-top:1px solid #1e1e38;background:#07070f;display:flex;align-items:center;gap:10px}
#mi{flex:1;min-width:0;height:38px;border:1px solid #1e1e38;border-radius:19px;background:#0f0f20;padding:0 14px;font-size:16px;color:#c8d8f0;font-family:system-ui,sans-serif;letter-spacing:.5px}
#mi::placeholder{color:#2a3a55}#mi:focus{outline:none}
.roundBtn{width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:18px;line-height:1}
.bolt{border:1.5px solid #2a2a50;background:transparent;color:#6070a0}.bolt.ready{color:#00ffcc;border-color:#00ffcc55}
.dopa{border:none;background:#c8a020;color:#07070f;opacity:.4}
.habit-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px;gap:10px;overflow:hidden;cursor:pointer}
.habit-title{font-size:14px;color:#ddeeff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-status{display:flex;gap:7px;align-items:center}.dot-on,.dot-off{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}.dot-on{background:#00ffcc}.dot-off{background:transparent;border:1.5px solid #2a3a55}
.counter{font-family:'Orbitron',monospace;font-size:8px;color:#4a6080;margin-left:4px;letter-spacing:1px}
.meter{width:100px;height:100px;border-left:1px solid #1e1e38;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;position:relative}
.empty{text-align:center;padding:80px 20px;color:#2a3a55}.empty-icon{font-size:24px;margin-bottom:10px}.empty-text{font-size:14px}
.task{background:#0f0f20;border:1px solid #1e1e38;border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;position:relative}
.task.charging{border-color:#ffd700}.task.done{opacity:.42}.task.habit{border-left:3px solid #00ffcc}.task.overdue{border-color:#ff336666}
.task-main{flex:1;min-width:0}.task-name{font-size:14px;line-height:1.4;color:#c8d8f0;word-break:break-word}.task.done .task-name{color:#3a4060;text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tag{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:.8px;color:#7890b8;border:1px solid #24304d;background:#090917;border-radius:999px;padding:3px 6px}.tag.due{color:#66ccff}.tag.habit{color:#00ffcc}.tag.warn{color:#ff8c8c;border-color:#ff336655}.tag.reward{color:#ffd24a;border-color:#ffd24a44}
.task-action{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}.task-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid #2a2a50;background:transparent;color:#3a3a65;cursor:pointer;display:flex;align-items:center;justify-content:center}.task.charging .task-btn{border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700}.push{font-family:'Orbitron',monospace;font-size:7px;color:#ffd700;letter-spacing:.5px}.done-mark{font-size:16px;color:#39ff14;flex-shrink:0}
.task-tools{display:flex;flex-direction:column;gap:5px;flex-shrink:0}.mini-btn{width:28px;height:28px;border-radius:8px;border:1px solid #23234a;background:#070712;color:#6070a0;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}.mini-btn:active{transform:scale(.95)}.mini-btn.danger{color:#ff6f8c;border-color:#ff336633}.mini-btn.undo{color:#00ffcc;border-color:#00ffcc33}
.completed{margin-top:12px;padding-top:10px;border-top:1px solid #111122}.completed-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.completed-title{font-family:'Orbitron',monospace;font-size:8px;color:#2a3a55;letter-spacing:2px;flex:1}.completed-btn{font-size:11px;border:1px solid #23234a;background:#06060e;color:#6070a0;border-radius:999px;padding:5px 8px;cursor:pointer}
.dream{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + var(--safe-bottom) + 8px);background:#0f0f20;border:1px solid #1e1e38;border-left:3px solid #c8a020;border-radius:10px;padding:12px 16px;font-size:13px;color:#ddeeff;font-weight:500;text-align:center;line-height:1.8;z-index:50;pointer-events:none;box-shadow:0 10px 32px rgba(0,0,0,.45)}
.dream-time{display:block;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#c8a020;margin-bottom:4px}.dream-quote{display:block}
@keyframes tslide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.5}}.tnew{animation:tslide .2s ease-out}.cbtn{animation:cpulse 1s ease-in-out infinite}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(2,2,8,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);opacity:0;pointer-events:none;transition:opacity .2s ease-out}.overlay.show{opacity:1;pointer-events:auto}
.popup{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:#0b0b18;border:1px solid #23234a;border-radius:18px;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.7);transform:translateY(12px) scale(.97);transition:transform .22s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}.overlay.show .popup{transform:translateY(0) scale(1)}
.popup-head{position:sticky;top:0;background:#0b0b18;display:flex;align-items:center;padding:16px 16px 12px;border-bottom:1px solid #181835;z-index:2}.popup-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:#00ffcc;font-weight:700;flex:1}.popup-close{width:30px;height:30px;border-radius:50%;border:1px solid #23234a;background:transparent;color:#6070a0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.popup-body{padding:16px}
.field-label{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#4a6080;margin:0 0 8px;text-transform:uppercase}.section{margin-bottom:22px}.name-input,.form-input,.form-select{width:100%;height:42px;border:1px solid #23234a;border-radius:10px;background:#06060e;color:#eaf2ff;padding:0 14px;font-size:16px;letter-spacing:.5px;font-family:system-ui,sans-serif}.name-input:focus,.form-input:focus,.form-select:focus{outline:none;border-color:#00ffcc55}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-help{font-size:11px;color:#56607e;line-height:1.6;margin-top:8px}.weekday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday-chip{height:34px;border-radius:10px;border:1px solid #23234a;background:#06060e;color:#6070a0;font-size:12px;cursor:pointer}.weekday-chip.on{border-color:#00ffcc;color:#00ffcc;background:#06130f}.form-actions{display:flex;gap:10px;margin-top:18px}.primary-btn,.danger-btn,.ghost-btn{height:42px;border-radius:12px;border:1px solid #23234a;padding:0 14px;font-weight:700;cursor:pointer}.primary-btn{flex:1;background:#00ffcc;color:#07100f;border:none}.ghost-btn{background:#06060e;color:#9ab0d0}.danger-btn{background:#16070c;color:#ff6f8c;border-color:#ff336655}
.stat-row{display:flex;gap:10px}.stat-box{flex:1;background:#06060e;border:1px solid #1a1a35;border-radius:10px;padding:12px 10px;text-align:center}.stat-num{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1}.stat-num.lv{color:#ffd24a}.stat-num.free{color:#00ffcc}.stat-cap{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1.5px;color:#4a6080;margin-top:6px}.free-note{margin-top:10px;background:#06130f;border:1px solid #00ffcc22;border-radius:10px;padding:10px 12px;text-align:center;color:#00ffcc;font-size:13px;font-weight:700}.level-bar{height:8px;border-radius:999px;background:#111124;overflow:hidden;margin-top:12px;border:1px solid #202044}.level-fill{height:100%;width:0%;background:#ffd24a;transition:width .25s}.level-note{text-align:center;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:#6d789b;margin-top:7px}
.preview-name{text-align:center;font-size:17px;padding:14px;background:#06060e;border:1px solid #1a1a35;border-radius:10px;line-height:1.5}.preview-name .pv-ttl{font-weight:500}.preview-name .pv-nm{font-weight:700;color:#eaf2ff}.preview-name .pv-empty{color:#3a4060;font-size:13px}.title-grid{display:flex;flex-wrap:wrap;gap:7px}.title-chip{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid #23234a;background:#06060e;color:#56607e;cursor:default;transition:all .12s;white-space:nowrap}.title-chip.owned{cursor:pointer;color:#c8d8f0}.title-chip.owned:active{transform:scale(.95)}.title-chip.locked{opacity:.4}.title-chip.sel{border-width:1.5px;font-weight:600;box-shadow:0 0 10px -2px currentColor}.title-none{font-size:12px;color:#56607e;border:1px dashed #23234a;border-radius:999px;padding:7px 11px;cursor:pointer;background:#06060e}.title-none.sel{border-style:solid;border-color:#00ffcc;color:#00ffcc}.illust-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.illust-cell{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid #1a1a35;background:#06060e;overflow:hidden;display:flex;align-items:center;justify-content:center}.illust-cell.locked{opacity:.85}.illust-cell .lockmark{font-size:15px;color:#2a3550}.illust-cell svg{width:100%;height:100%;display:block}.illust-cap{font-family:'Orbitron',monospace;font-size:6px;letter-spacing:1px;text-align:center;margin-top:4px;color:#4a6080}
#rewardOverlay .popup{max-width:300px;text-align:center;border-color:#23234a}.rw-stage{padding:30px 22px 26px;position:relative}.rw-tier-label{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:4px;font-weight:700;margin-bottom:18px}.rw-icon{width:108px;height:108px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}.rw-icon svg{width:100%;height:100%}.rw-reward-type{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#4a6080;margin-bottom:8px}.rw-reward-main{font-size:22px;font-weight:700;line-height:1.4;color:#eaf2ff;margin-bottom:6px}.rw-reward-sub{font-size:13px;color:#8898b8}.rw-tap{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#3a4565;margin-top:22px}
@keyframes rwpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes rwglow{0%,100%{filter:drop-shadow(0 0 6px currentColor)}50%{filter:drop-shadow(0 0 20px currentColor)}}.rw-icon.animate{animation:rwpop .5s cubic-bezier(.2,.9,.3,1.3),rwglow 1.6s ease-in-out infinite .5s}
.toast{position:absolute;left:50%;bottom:calc(var(--dock-h) + var(--safe-bottom) + 16px);transform:translateX(-50%);z-index:80;background:#0f0f20;border:1px solid #23234a;border-radius:999px;color:#c8d8f0;padding:9px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="sf8">
  <div id="pc"></div>
  <div class="header">
    <div class="brand"><span class="logo">DOPAON</span><span class="sub">TASK SYS</span></div>
    <div class="identity" id="identity" onclick="openProfile()">
      <div class="id-text"><div class="id-name" id="hdName"></div><div class="id-lv"><span>Lv.<b id="hdLv">0</b></span><span class="free" id="hdFree">+0日</span></div></div>
      <div class="id-avatar">👤</div>
    </div>
  </div>
  <div id="ta"></div>
  <div id="bottomDock">
    <div id="habitRow">
      <div class="habit-main"><span class="habit-title">パチスロをしない</span><div class="habit-status"><span class="dot-on"></span><span class="dot-off"></span><span class="dot-off"></span><span class="counter">1/3</span><span style="font-size:13px;color:#3a5070;margin-left:auto;">›</span></div></div>
      <div class="meter" id="chargeMeter">
        <svg width="82" height="82" viewBox="0 0 82 82" aria-hidden="true">
          <circle cx="41" cy="41" r="36" fill="none" stroke="#181830" stroke-width="5" stroke-dasharray="3.5 2.2"/><circle cx="41" cy="41" r="36" fill="none" stroke="#39ff14" stroke-width="5" stroke-dasharray="143 83" transform="rotate(-90 41 41)"/><circle cx="41" cy="41" r="28" fill="#0e0e1c" stroke="#252545" stroke-width="1.5"/><circle cx="41" cy="41" r="24" fill="#06060e"/>
          <line x1="31" y1="31" x2="35" y2="31" stroke="#00ffcc" stroke-width="1.5"/><line x1="31" y1="31" x2="31" y2="35" stroke="#00ffcc" stroke-width="1.5"/><line x1="51" y1="31" x2="47" y2="31" stroke="#00ffcc" stroke-width="1.5"/><line x1="51" y1="31" x2="51" y2="35" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="31" y1="51" x2="35" y2="51" stroke="#00ffcc" stroke-width="1.5"/><line x1="31" y1="51" x2="31" y2="47" stroke="#00ffcc" stroke-width="1.5"/><line x1="51" y1="51" x2="47" y2="51" stroke="#00ffcc" stroke-width="1.5"/><line x1="51" y1="51" x2="51" y2="47" stroke="#00ffcc" stroke-width="1.5"/>
          <text x="41" y="39" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00ffcc">DO</text><text x="41" y="50" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00ffcc" opacity=".7">DO!!</text>
        </svg>
      </div>
    </div>
    <div id="inputBar">
      <button id="ib" class="roundBtn bolt" onclick="openTaskMenu()" aria-label="タスク設定">☰</button>
      <input id="mi" type="text" placeholder="タスクを入力..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" oninput="onIn(event)" onbeforeinput="onBeforeInput(event)" onkeydown="onKey(event)" oncompositionstart="onCompStart(event)" oncompositionupdate="onCompUpdate(event)" oncompositionend="onCompEnd(event)" onfocus="onInputFocus()" onblur="onInputBlur()" />
      <button id="db" class="roundBtn dopa" onclick="doDopa()" aria-label="DOPAON!">✦</button>
    </div>
  </div>

  <div class="overlay" id="profileOverlay">
    <div class="popup">
      <div class="popup-head"><span class="popup-title">PROFILE</span><button class="popup-close" onclick="closeProfile()" aria-label="閉じる">✕</button></div>
      <div class="popup-body">
        <div class="section"><div class="preview-name" id="namePreview"></div></div>
        <div class="section"><p class="field-label">名前</p><input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="名前を入力" oninput="onNameInput()" autocomplete="off" /></div>
        <div class="section">
          <div class="stat-row"><div class="stat-box"><div class="stat-num lv" id="pfLv">0</div><div class="stat-cap">LEVEL</div></div><div class="stat-box"><div class="stat-num free" id="pfFree">+0日</div><div class="stat-cap">FREE BONUS</div></div></div>
          <div class="level-bar"><div class="level-fill" id="pfLevelFill"></div></div><div class="level-note" id="pfLevelNote">NEXT +6 XP</div><div class="free-note" id="pfFreeNote">現在無料期間 +0日 追加！</div>
        </div>
        <div class="section"><p class="field-label">肩書き <span id="titleCount" style="color:#2a3a55"></span></p><div class="title-grid" id="titleGrid"></div></div>
        <div class="section" style="margin-bottom:6px"><p class="field-label">イラスト</p><div class="illust-grid" id="illustGrid"></div></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="rewardOverlay" onclick="closeReward()">
    <div class="popup" onclick="event.stopPropagation()"><div class="rw-stage"><div class="rw-tier-label" id="rwTierLabel"></div><div class="rw-icon" id="rwIcon"></div><div class="rw-reward-type" id="rwType"></div><div class="rw-reward-main" id="rwMain"></div><div class="rw-reward-sub" id="rwSub"></div><div class="rw-tap">TAP TO CLOSE</div></div></div>
  </div>

  <div class="overlay" id="taskOverlay">
    <div class="popup">
      <div class="popup-head"><span class="popup-title" id="taskPopupTitle">TASK MENU</span><button class="popup-close" onclick="closeTaskMenu()" aria-label="閉じる">✕</button></div>
      <div class="popup-body">
        <div class="section"><p class="field-label">タスク名</p><input class="form-input" id="taskNameInput" type="text" maxlength="60" placeholder="タスク名" autocomplete="off" /></div>
        <div class="section"><div class="form-row"><div><p class="field-label">種別</p><select class="form-select" id="taskTypeInput" onchange="syncTaskMenuFields()"><option value="normal">通常タスク</option><option value="habit">習慣タスク</option></select></div><div><p class="field-label">日付</p><input class="form-input" id="taskDueInput" type="date" /></div></div></div>
        <div class="section" id="habitFields">
          <div class="form-row"><div><p class="field-label">チェック内容</p><select class="form-select" id="habitKindInput"><option value="do">やること</option><option value="avoid">やらないこと</option></select></div><div><p class="field-label">管理方式</p><select class="form-select" id="repeatTypeInput" onchange="syncTaskMenuFields()"><option value="daily">毎日</option><option value="interval">何日起き</option><option value="weekdays">曜日管理</option></select></div></div>
          <div id="intervalBox" style="margin-top:14px"><p class="field-label">何日起き</p><input class="form-input" id="intervalDaysInput" type="number" min="1" max="30" value="1" /></div>
          <div id="weekdayBox" style="margin-top:14px"><p class="field-label">曜日</p><div class="weekday-grid" id="weekdayGrid"></div></div>
          <div class="form-help">習慣タスクは、あとでタスク右側の⚙から同じ設定を変更できる。</div>
        </div>

}
function normalizeState(s){
  const out={version:APP_VERSION,profile:{name:'',titleId:null},xp:0,freeDays:0,ownedTitles:[],ownedIllusts:[],tasks:[],ui:{completedOpen:false}};
  if(s&&typeof s==='object')Object.assign(out,s);

  out.xp=Number(out.xp)||0;out.freeDays=Number(out.freeDays)||0;
  out.ownedTitles=Array.isArray(out.ownedTitles)?[...new Set(out.ownedTitles)]:[];

  return out;
}
function safeParse(raw){try{return raw?JSON.parse(raw):null}catch(e){return null}}
function loadState(){
  const keys=[STORAGE_KEY,...LEGACY_KEYS,BACKUP_KEY];
  for(const k of keys){const parsed=safeParse(localStorage.getItem(k));if(parsed){state=normalizeState(parsed);saveNow();return}}
  state=normalizeState(null);
}
function saveNow(){
  try{const old=localStorage.getItem(STORAGE_KEY);if(old)localStorage.setItem(BACKUP_KEY,old);localStorage.setItem(STORAGE_KEY,JSON.stringify(normalizeState(state)))}
  catch(e){showToast('保存に失敗。空き容量を確認して')}
}
function saveState(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;saveNow()},90)}
window.addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});

function rollTier(){const r=Math.random();if(r<0.47)return null;if(r<0.80)return 'white';const b=Math.random();if(b<0.15)return 'white';if(b<0.45)return 'blue';if(b<0.70)return 'green';if(b<0.88)return 'purple';if(b<0.97)return 'red';return 'gold'}
function grantReward(tier){const T=TIERS[tier];const canIllust=tier!=='white'&&!state.ownedIllusts.includes(tier);const pool=['title','days'];if(canIllust)pool.push('illust');const type=rnd(pool);if(type==='illust'){state.ownedIllusts.push(tier);return{kind:'illust',tier}}if(type==='days'){state.freeDays+=T.days;return{kind:'days',tier,days:T.days}}const avail=TITLES.filter(t=>t.tier===tier&&!state.ownedTitles.includes(t.id));if(avail.length){const got=rnd(avail);state.ownedTitles.push(got.id);if(!state.profile.titleId)state.profile.titleId=got.id;return{kind:'title',tier,title:got}}state.xp+=T.xp;return{kind:'levelup',tier,xp:T.xp}}
function runReward(){const tier=rollTier();if(!tier)return;const result=grantReward(tier);saveState();renderHeader();showReward(result)}

function renderHeader(){const nm=state.profile.name,t=titleById(state.profile.titleId),nameEl=document.getElementById('hdName');if(!nm)nameEl.innerHTML='<span style="color:#56607e;font-weight:500">名前未設定</span>';else{nameEl.innerHTML=(t?'<span class="ttl" style="color:'+TIERS[t.tier].color+'">'+escapeHtml(t.text)+'</span>':'')+'<span> '+escapeHtml(nm)+'</span>'}document.getElementById('hdLv').textContent=levelFromXp(state.xp);document.getElementById('hdFree').textContent='+'+state.freeDays+'日'}

function isSideMark(ch){return /[！!？?‼⁉⁈♡♥❤★☆♪♫♬〜ー…‥・。、,.，．]/.test(ch)}
function grps(txt){const cs=Array.from(txt),gs=[];let i=0;while(i<cs.length){if(isSideMark(cs[i])){let j=i;while(j<cs.length&&isSideMark(cs[j]))j++;gs.push({side:true,t:cs.slice(i,j).join('')});i=j}else{gs.push({side:false,t:cs[i]});i++}}return gs}

function getTextBox(groups,fs){const pad=Math.ceil(fs*.55),lh=Math.ceil(fs*1.34),maxMark=groups.reduce((m,g)=>g.side?Math.max(m,charLen(g.t)):m,1);return{w:Math.ceil(Math.max(fs,maxMark*fs*.62)+pad*2),h:Math.ceil(groups.length*lh+pad),pad,lh}}
function txPair(svg,x,y,fs,txt,col){const outer=Math.max(4,fs*.24),inner=Math.max(2,fs*.11);[['none','white',outer],[col,'#111',inner]].forEach(([fill,stroke,sw])=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('font-family',FF);t.setAttribute('font-size',fs);t.setAttribute('font-weight','900');t.setAttribute('fill',fill);t.setAttribute('stroke',stroke);t.setAttribute('stroke-width',sw);t.setAttribute('stroke-linejoin','round');if(fill!=='none')t.setAttribute('paint-order','stroke');t.textContent=txt;svg.appendChild(t)})}
function drawPraiseText(svg,item,groups,box,fs){let cy=box.pad/2+box.lh/2;groups.forEach(g=>{const len=Math.max(1,charLen(g.t)),fitFs=g.side?Math.min(fs,Math.max(10,(box.w-box.pad*.65)/(len*.62))):fs;txPair(svg,box.w/2,cy,fitFs,g.t,item.c);cy+=box.lh})}
function getPraiseOrigin(){const pc=document.getElementById('pc'),dock=document.getElementById('bottomDock');if(!pc||!dock)return{x:180,y:360};const pcRect=pc.getBoundingClientRect(),dockRect=dock.getBoundingClientRect();return{x:clamp(dockRect.left+dockRect.width/2-pcRect.left,48,pc.clientWidth-48),y:clamp(dockRect.top-pcRect.top+20,pc.clientHeight*.55,pc.clientHeight+86)}}
function getLanes(origin){const pc=document.getElementById('pc'),count=pc.clientWidth<360?5:7,topY=18,minX=38,maxX=pc.clientWidth-38,lanes=[];for(let i=0;i<count;i++){const targetX=count===1?pc.clientWidth/2:minX+(maxX-minX)*(i/(count-1)),dx=targetX-origin.x,dy=topY-origin.y;lanes.push({index:i,angle:Math.atan2(dy,dx)*180/Math.PI,len:Math.hypot(dx,dy)})}return lanes}
function getPointOnLane(origin,lane,d){const r=lane.angle*Math.PI/180;return{x:origin.x+Math.cos(r)*d,y:origin.y+Math.sin(r)*d}}
function fitsInPraiseArea(x,y,w,h){const pc=document.getElementById('pc');return x-w/2>P_MARGIN&&x+w/2<pc.clientWidth-P_MARGIN&&y-h/2>P_MARGIN&&y+h/2<pc.clientHeight-P_MARGIN}
function pickPraisePosition(w,h){const pc=document.getElementById('pc'),origin=getPraiseOrigin(),lanes=getLanes(origin),free=lanes.filter(l=>!busyLanes.has(l.index)),pool=shuffle(free.length?free:lanes);for(const lane of pool){const minD=88,maxD=Math.max(minD+20,Math.min(lane.len-54,340));for(let i=0;i<9;i++){const d=minD+Math.random()*(maxD-minD),p=getPointOnLane(origin,lane,d);if(fitsInPraiseArea(p.x,p.y,w,h))return{lane,x:p.x,y:p.y,angle:lane.angle}}}const fb=pool[0]||lanes[0]||{index:0,angle:-90},p=getPointOnLane(origin,fb,150);return{lane:fb,x:clamp(p.x,w/2+P_MARGIN,pc.clientWidth-w/2-P_MARGIN),y:clamp(p.y,h/2+P_MARGIN,pc.clientHeight-h/2-P_MARGIN),angle:fb.angle}}
function spawnPraise(mode='input',forcedItem=null){if(livePraise>=MAX_PRAISE)return false;syncViewport();const pc=document.getElementById('pc');if(!pc)return false;const item=forcedItem||rnd(mode==='done'?DONE_PR:mode==='add'?ADD_PR:PR),groups=grps(item.t),fs=textSize(mode),box=getTextBox(groups,fs),pos=pickPraisePosition(box.w,box.h),rot=clamp(pos.angle+90,-34,34);busyLanes.add(pos.lane.index);livePraise++;const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',box.w);svg.setAttribute('height',box.h);svg.setAttribute('viewBox','0 0 '+box.w+' '+box.h);svg.style.cssText='position:absolute;left:'+(pos.x-box.w/2).toFixed(1)+'px;top:'+(pos.y-box.h/2).toFixed(1)+'px;transform:rotate('+rot.toFixed(1)+'deg) scale(.96);opacity:0;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));';drawPraiseText(svg,item,groups,box,fs);pc.appendChild(svg);activePraise.add(svg);const scale=mode==='input'?1:1.06;const anim=svg.animate([{opacity:0,transform:'rotate('+rot.toFixed(1)+'deg) translateY(8px) scale(.9)'},{opacity:1,transform:'rotate('+rot.toFixed(1)+'deg) translateY(0) scale('+scale+')',offset:.12},{opacity:1,transform:'rotate('+rot.toFixed(1)+'deg) translateY(-8px) scale(1)',offset:.78},{opacity:0,transform:'rotate('+rot.toFixed(1)+'deg) translateY(-18px) scale(.96)'}],{duration:PRAISE_LIFE,easing:'cubic-bezier(.18,.8,.22,1)',fill:'forwards'});anim.onfinish=()=>releasePraise(svg,pos.lane.index);return true}
function releasePraise(svg,laneIndex){if(!activePraise.has(svg))return;activePraise.delete(svg);busyLanes.delete(laneIndex);livePraise=Math.max(0,livePraise-1);if(svg.parentNode)svg.remove();if(praiseQueue>0)drainPraiseQueue()}
function enqueuePraise(amount){if(amount<=0)return;praiseQueue=clamp(praiseQueue+amount,0,MAX_PRAISE_QUEUE);drainPraiseQueue()}
function drainPraiseQueue(){if(praiseDrainTimer)return;const run=()=>{praiseDrainTimer=null;if(praiseQueue<=0)return;if(livePraise>=MAX_PRAISE){praiseDrainTimer=setTimeout(run,140);return}praiseQueue--;spawnPraise('input');if(praiseQueue>0)praiseDrainTimer=setTimeout(run,PRAISE_COOLDOWN)};run()}
function clearPraiseQueue(){praiseQueue=0;if(praiseDrainTimer){clearTimeout(praiseDrainTimer);praiseDrainTimer=null}}
function updateInputButtons(v){const db=document.getElementById('db'),ib=document.getElementById('ib');db.style.opacity=v?'1':'.4';ib.classList.toggle('ready',Boolean(v))}
function resetPraiseInput(){lastStableText=rawValue();lastCompText='';clearPraiseQueue()}
function onBeforeInput(){syncViewport()}
function onCompStart(){syncViewport();isComposing=true;lastStableText=rawValue();lastCompText=''}
function onCompUpdate(e){syncViewport();const data=e&&typeof e.data==='string'?e.data:'';const diff=charLen(data)-charLen(lastCompText);if(diff>0)enqueuePraise(diff);lastCompText=data;updateInputButtons(rawValue().trim()||data)}
function onCompEnd(){syncViewport();isComposing=false;lastStableText=rawValue();lastCompText='';updateInputButtons(vl())}
function onIn(e){syncViewport();const raw=rawValue();updateInputButtons(raw.trim());if(!raw&&!isComposing){resetPraiseInput();return}if(isComposing||(e&&e.isComposing))return;const diff=charLen(raw)-charLen(lastStableText);if(diff>0)enqueuePraise(diff);lastStableText=raw}
function onInputFocus(){setTimeout(()=>{initBaseViewport(false);syncViewport();resetPraiseInput()},40);setTimeout(syncViewport,120);setTimeout(syncViewport,260);setTimeout(syncViewport,520)}
function onInputBlur(){setTimeout(()=>{initBaseViewport(false);syncViewport()},120)}
function onKey(e){if(e.key==='Enter'&&!isComposing){e.preventDefault();doQuickAdd()}}

function defaultTaskConfig(){return{name:'',dueDate:'',taskType:'normal',habitKind:'do',repeatType:'daily',intervalDays:1,weekdays:[]}}
function readTaskForm(){return{name:document.getElementById('taskNameInput').value.trim(),dueDate:document.getElementById('taskDueInput').value,taskType:document.getElementById('taskTypeInput').value,habitKind:document.getElementById('habitKindInput').value,repeatType:document.getElementById('repeatTypeInput').value,intervalDays:clamp(Number(document.getElementById('intervalDaysInput').value)||1,1,30),weekdays:[...menuWeekdays]}}
function taskFromConfig(cfg,old){return Object.assign(old||{}, {name:cfg.name,dueDate:cfg.dueDate,taskType:cfg.taskType,habitKind:cfg.habitKind,repeatType:cfg.repeatType,intervalDays:cfg.intervalDays,weekdays:cfg.weekdays})}
function createTask(name,cfg={}){return normalizeTask(Object.assign(defaultTaskConfig(),cfg,{id:newId(),name,state:'idle',rewardDone:false,createdAt:Date.now(),doneAt:null}))}
function openTaskMenu(id=null){document.getElementById('mi').blur();editingTaskId=id;const t=id?state.tasks.find(x=>x.id===id):null;const cfg=t?normalizeTask(t):Object.assign(defaultTaskConfig(),{name:vl()});document.getElementById('taskPopupTitle').textContent=t?'TASK EDIT':'TASK MENU';document.getElementById('taskSaveBtn').textContent=t?'保存する':'追加する';document.getElementById('taskDangerRow').style.display=t?'flex':'none';document.getElementById('taskNameInput').value=cfg.name||'';document.getElementById('taskDueInput').value=cfg.dueDate||'';document.getElementById('taskTypeInput').value=cfg.taskType||'normal';document.getElementById('habitKindInput').value=cfg.habitKind||'do';document.getElementById('repeatTypeInput').value=cfg.repeatType||'daily';document.getElementById('intervalDaysInput').value=cfg.intervalDays||1;menuWeekdays=Array.isArray(cfg.weekdays)?[...cfg.weekdays]:[];renderWeekdayGrid();syncTaskMenuFields();document.getElementById('taskOverlay').classList.add('show');setTimeout(()=>document.getElementById('taskNameInput').focus(),160)}
function closeTaskMenu(){document.getElementById('taskOverlay').classList.remove('show');editingTaskId=null}
function syncTaskMenuFields(){const isHabit=document.getElementById('taskTypeInput').value==='habit',repeat=document.getElementById('repeatTypeInput').value;document.getElementById('habitFields').style.display=isHabit?'block':'none';document.getElementById('intervalBox').style.display=isHabit&&repeat==='interval'?'block':'none';document.getElementById('weekdayBox').style.display=isHabit&&repeat==='weekdays'?'block':'none'}
function renderWeekdayGrid(){const grid=document.getElementById('weekdayGrid');grid.innerHTML='';WEEKDAYS.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='weekday-chip'+(menuWeekdays.includes(i)?' on':'');b.textContent=w;b.onclick=()=>{menuWeekdays=menuWeekdays.includes(i)?menuWeekdays.filter(x=>x!==i):[...menuWeekdays,i].sort((a,b)=>a-b);renderWeekdayGrid()};grid.appendChild(b)})}
function saveTaskMenu(){const cfg=readTaskForm();if(!cfg.name){showToast('タスク名を入れて');return}if(cfg.taskType==='habit'&&cfg.repeatType==='weekdays'&&!cfg.weekdays.length){showToast('曜日を1つ以上選んで');return}if(editingTaskId){const t=state.tasks.find(x=>x.id===editingTaskId);if(t){taskFromConfig(cfg,t);saveState();render();showToast('タスク設定を保存した')}}else{state.tasks.unshift(createTask(cfg.name,cfg));document.getElementById('mi').value='';resetPraiseInput();updateInputButtons('');saveState();render();spawnPraise('add');showToast('タスクを追加した')}closeTaskMenu()}
function deleteEditingTask(){if(editingTaskId)deleteTask(editingTaskId,true)}
function doQuickAdd(){const v=vl();if(!v)return;state.tasks.unshift(createTask(v));document.getElementById('mi').value='';resetPraiseInput();updateInputButtons('');saveState();render();spawnPraise('add')}
function doDopa(){const v=vl();if(!v)return;showDopaonMessage(v);doQuickAdd()}
function deleteTask(id,fromMenu=false){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!confirm('「'+t.name+'」を削除する？'))return;state.tasks=state.tasks.filter(x=>x.id!==id);saveState();render();if(fromMenu)closeTaskMenu();showToast('削除した')}
function undoTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.state='idle';t.doneAt=null;saveState();render();spawnPraise('add',{t:'戻した！',c:'#00ffcc'});showToast('完了を取り消した。再完了しても再抽選なし')}
function tap(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(t.state==='idle'){t.state='charging';saveState();render()}else if(t.state==='charging'){t.state='done';t.doneAt=Date.now();const shouldReward=!t.rewardDone;t.rewardDone=true;saveState();render();setTimeout(()=>spawnPraise('done'),60);if(shouldReward)setTimeout(runReward,260)}}
function formatDateLabel(s){if(!s)return '';const d=new Date(s+'T00:00:00');if(Number.isNaN(d.getTime()))return s;return (d.getMonth()+1)+'/'+d.getDate()+'('+WEEKDAYS[d.getDay()]+')'}
function taskMeta(t){const tags=[];if(t.dueDate){const overdue=t.state!=='done'&&t.dueDate<todayStr();tags.push({cls:'due '+(overdue?'warn':''),txt:(overdue?'期限超過 ':'期限 ')+formatDateLabel(t.dueDate)})}if(t.taskType==='habit'){let r=t.repeatType==='daily'?'毎日':t.repeatType==='interval'?t.intervalDays+'日起き':(t.weekdays||[]).map(i=>WEEKDAYS[i]).join('');tags.push({cls:'habit',txt:(t.habitKind==='avoid'?'やらない ':'やる ')+r})}if(t.rewardDone)tags.push({cls:'reward',txt:'抽選済'});return tags}
function render(){const a=document.getElementById('ta');a.innerHTML='';if(!state.tasks.length){a.innerHTML='<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">タスクを入力して追加しよう</div></div>';return}const act=state.tasks.filter(t=>t.state!=='done'),done=state.tasks.filter(t=>t.state==='done');act.forEach((t,i)=>{const c=mkC(t);if(i===0)c.classList.add('tnew');a.appendChild(c)});if(done.length){const s=document.createElement('div');s.className='completed';s.innerHTML='<div class="completed-head"><span class="completed-title">COMPLETED '+done.length+'</span><button class="completed-btn" onclick="toggleCompleted()">'+(state.ui.completedOpen?'隠す':'表示')+'</button><button class="completed-btn" onclick="clearCompleted()">整理</button></div>';a.appendChild(s);if(state.ui.completedOpen)done.forEach(t=>a.appendChild(mkC(t)))}}
function mkC(task){const iC=task.state==='charging',iD=task.state==='done',el=document.createElement('div');el.className='task'+(iC?' charging':'')+(iD?' done':'')+(task.taskType==='habit'?' habit':'')+(task.dueDate&&task.state!=='done'&&task.dueDate<todayStr()?' overdue':'');const main=document.createElement('div');main.className='task-main';const nm=document.createElement('div');nm.className='task-name';nm.textContent=task.name;main.appendChild(nm);const metas=taskMeta(task);if(metas.length){const meta=document.createElement('div');meta.className='task-meta';metas.forEach(m=>{const tag=document.createElement('span');tag.className='tag '+m.cls;tag.textContent=m.txt;meta.appendChild(tag)});main.appendChild(meta)}el.appendChild(main);const w=document.createElement('div');w.className='task-action';if(!iD){const b=document.createElement('button');b.className='task-btn'+(iC?' cbtn':'');b.onclick=()=>tap(task.id);b.setAttribute('aria-label',iC?'完了確定':'チャージ開始');b.innerHTML=iC?'<span style="font-family:\'Orbitron\',monospace;font-size:7px;font-weight:700;">確定</span>':'<span style="font-size:17px;">✓</span>';w.appendChild(b);if(iC){const h=document.createElement('span');h.className='push';h.textContent='PUSH';w.appendChild(h)}}else{const ic=document.createElement('span');ic.className='done-mark';ic.textContent='✓';w.appendChild(ic)}el.appendChild(w);const tools=document.createElement('div');tools.className='task-tools';if(iD){const u=document.createElement('button');u.className='mini-btn undo';u.textContent='↩';u.onclick=()=>undoTask(task.id);tools.appendChild(u)}const edit=document.createElement('button');edit.className='mini-btn';edit.textContent='⚙';edit.onclick=()=>openTaskMenu(task.id);tools.appendChild(edit);const del=document.createElement('button');del.className='mini-btn danger';del.textContent='×';del.onclick=()=>deleteTask(task.id);tools.appendChild(del);el.appendChild(tools);return el}
function toggleCompleted(){state.ui.completedOpen=!state.ui.completedOpen;saveState();render()}
function clearCompleted(){const n=state.tasks.filter(t=>t.state==='done').length;if(!n)return;if(!confirm('完了済みタスク '+n+'件を整理して削除する？\n報酬・プロフィール・無料期間は残る。'))return;state.tasks=state.tasks.filter(t=>t.state!=='done');saveState();render();showToast('完了済みを整理した')}

function handleViewportChange(){syncViewport();setTimeout(syncViewport,60);setTimeout(syncViewport,180)}
if(window.visualViewport){visualViewport.addEventListener('resize',handleViewportChange);visualViewport.addEventListener('scroll',handleViewportChange)}
window.addEventListener('resize',()=>{initBaseViewport(false);syncViewport()});window.addEventListener('orientationchange',()=>{setTimeout(()=>{initBaseViewport(true);syncViewport()},300);setTimeout(syncViewport,700)});window.addEventListener('scroll',lockScroll,{passive:true});
document.addEventListener('touchmove',e=>{if(e.target.closest('#ta'))return;if(e.target.closest('.popup'))return;e.preventDefault()},{passive:false});

loadState();initBaseViewport(true);syncViewport();renderHeader();render();resetPraiseInput();
</script>
