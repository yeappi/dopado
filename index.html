<title>DOPADO TASK SYSTEM</title>

<style>

#pc{position:absolute;top:calc(var(--safe-top) + var(--header-h) + var(--status-h));bottom:0;left:0;right:0;pointer-events:none;overflow:hidden;z-index:40;transform:translateZ(0)}
#bottomDock{position:absolute;left:0;right:0;bottom:0;height:calc(var(--dock-h) + var(--safe-bottom));z-index:35;transform:translate3d(0,calc(var(--kb) * -1),0);transition:transform .18s ease-out;will-change:transform;background:#07070f}

.task.charging{border-color:#ffd700}.task.done{opacity:.42}.task.habit{border-left:3px solid #00ffcc}.task.overdue{border-color:#ff336666}
.task-main{flex:1;min-width:0}.task-name{font-size:14px;line-height:1.4;color:#c8d8f0;word-break:break-word}.task.done .task-name{color:#3a4060;text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tag{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:.8px;color:#7890b8;border:1px solid #24304d;background:#090917;border-radius:999px;padding:3px 6px}.tag.due{color:#66ccff}.tag.habit{color:#00ffcc}.tag.warn{color:#ff8c8c;border-color:#ff336655}.tag.reward{color:#ffd24a;border-color:#ffd24a44}
.task-action{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}.task-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid #2a2a50;background:transparent;color:#3a3a65;cursor:pointer;display:flex;align-items:center;justify-content:center}.task.charging .task-btn{border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700}.push{font-family:'Orbitron',monospace;font-size:7px;color:#ffd700;letter-spacing:.5px}.done-mark{font-size:16px;color:#39ff14;flex-shrink:0}
.task-tools{display:flex;flex-direction:column;gap:5px;flex-shrink:0}.mini-btn{width:28px;height:28px;border-radius:8px;border:1px solid #23234a;background:#070712;color:#6070a0;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}.mini-btn:active{transform:scale(.95)}.mini-btn.danger{color:#ff6f8c;border-color:#ff336633}.mini-btn.undo{color:#00ffcc;border-color:#00ffcc33}
.completed{margin-top:12px;padding-top:10px;border-top:1px solid #111122}.completed-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.completed-title{font-family:'Orbitron',monospace;font-size:8px;color:#2a3a55;letter-spacing:2px;flex:1}.completed-btn{font-size:11px;border:1px solid #23234a;background:#06060e;color:#6070a0;border-radius:999px;padding:5px 8px;cursor:pointer}
.dream{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + var(--safe-bottom) + 8px);background:#0f0f20;border:1px solid #1e1e38;border-left:3px solid #c8a020;border-radius:10px;padding:12px 16px;font-size:13px;color:#ddeeff;font-weight:500;text-align:center;line-height:1.8;z-index:50;pointer-events:none;box-shadow:0 10px 32px rgba(0,0,0,.45)}
.dream-time{display:block;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#c8a020;margin-bottom:4px}.dream-quote{display:block}
@keyframes tslide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.5}}.tnew{animation:tslide .2s ease-out}.cbtn{animation:cpulse 1s ease-in-out infinite}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(2,2,8,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);opacity:0;pointer-events:none;transition:opacity .2s ease-out}.overlay.show{opacity:1;pointer-events:auto}
.popup{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:#0b0b18;border:1px solid #23234a;border-radius:18px;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.7);transform:translateY(12px) scale(.97);transition:transform .22s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}.overlay.show .popup{transform:translateY(0) scale(1)}
.popup-head{position:sticky;top:0;background:#0b0b18;display:flex;align-items:center;padding:16px 16px 12px;border-bottom:1px solid #181835;z-index:2}.popup-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:#00ffcc;font-weight:700;flex:1}.popup-close{width:30px;height:30px;border-radius:50%;border:1px solid #23234a;background:transparent;color:#6070a0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.popup-body{padding:16px}
.field-label{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#4a6080;margin:0 0 8px;text-transform:uppercase}.section{margin-bottom:22px}.name-input,.form-input,.form-select{width:100%;height:42px;border:1px solid #23234a;border-radius:10px;background:#06060e;color:#eaf2ff;padding:0 14px;font-size:16px;letter-spacing:.5px;font-family:system-ui,sans-serif}.name-input:focus,.form-input:focus,.form-select:focus{outline:none;border-color:#00ffcc55}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-help{font-size:11px;color:#56607e;line-height:1.6;margin-top:8px}.weekday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday-chip{height:34px;border-radius:10px;border:1px solid #23234a;background:#06060e;color:#6070a0;font-size:12px;cursor:pointer}.weekday-chip.on{border-color:#00ffcc;color:#00ffcc;background:#06130f}.form-actions{display:flex;gap:10px;margin-top:18px}.primary-btn,.danger-btn,.ghost-btn{height:42px;border-radius:12px;border:1px solid #23234a;padding:0 14px;font-weight:700;cursor:pointer}.primary-btn{flex:1;background:#00ffcc;color:#07100f;border:none}.ghost-btn{background:#06060e;color:#9ab0d0}.danger-btn{background:#16070c;color:#ff6f8c;border-color:#ff336655}
.stat-row{display:flex;gap:10px}.stat-box{flex:1;background:#06060e;border:1px solid #1a1a35;border-radius:10px;padding:12px 10px;text-align:center}.stat-num{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1}.stat-num.lv{color:#ffd24a}.stat-num.free{color:#00ffcc}.stat-cap{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1.5px;color:#4a6080;margin-top:6px}.free-note{margin-top:10px;background:#06130f;border:1px solid #00ffcc22;border-radius:10px;padding:10px 12px;text-align:center;color:#00ffcc;font-size:13px;font-weight:700}.level-bar{height:8px;border-radius:999px;background:#111124;overflow:hidden;margin-top:12px;border:1px solid #202044}.level-fill{height:100%;width:0%;background:#ffd24a;transition:width .25s}.level-note{text-align:center;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:#6d789b;margin-top:7px}
.preview-name{text-align:center;font-size:17px;padding:14px;background:#06060e;border:1px solid #1a1a35;border-radius:10px;line-height:1.5}.preview-name .pv-ttl{font-weight:500}.preview-name .pv-nm{font-weight:700;color:#eaf2ff}.preview-name .pv-empty{color:#3a4060;font-size:13px}.title-grid{display:flex;flex-wrap:wrap;gap:7px}.title-chip{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid #23234a;background:#06060e;color:#56607e;cursor:default;transition:all .12s;white-space:nowrap}.title-chip.owned{cursor:pointer;color:#c8d8f0}.title-chip.owned:active{transform:scale(.95)}.title-chip.locked{opacity:.4}.title-chip.sel{border-width:1.5px;font-weight:600;box-shadow:0 0 10px -2px currentColor}.title-none{font-size:12px;color:#56607e;border:1px dashed #23234a;border-radius:999px;padding:7px 11px;cursor:pointer;background:#06060e}.title-none.sel{border-style:solid;border-color:#00ffcc;color:#00ffcc}.illust-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.illust-cell{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid #1a1a35;background:#06060e;overflow:hidden;display:flex;align-items:center;justify-content:center}.illust-cell.locked{opacity:.85}.illust-cell .lockmark{font-size:15px;color:#2a3550}.illust-cell svg{width:100%;height:100%;display:block}.illust-cap{font-family:'Orbitron',monospace;font-size:6px;letter-spacing:1px;text-align:center;margin-top:4px;color:#4a6080}
#rewardOverlay .popup{max-width:300px;text-align:center;border-color:#23234a}.rw-stage{padding:30px 22px 26px;position:relative}.rw-tier-label{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:4px;font-weight:700;margin-bottom:18px}.rw-icon{width:108px;height:108px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}.rw-icon svg{width:100%;height:100%}.rw-reward-type{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#4a6080;margin-bottom:8px}.rw-reward-main{font-size:22px;font-weight:700;line-height:1.4;color:#eaf2ff;margin-bottom:6px}.rw-reward-sub{font-size:13px;color:#8898b8}.rw-tap{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:#3a4565;margin-top:22px}
@keyframes rwpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes rwglow{0%,100%{filter:drop-shadow(0 0 6px currentColor)}50%{filter:drop-shadow(0 0 20px currentColor)}}.rw-icon.animate{animation:rwpop .5s cubic-bezier(.2,.9,.3,1.3),rwglow 1.6s ease-in-out infinite .5s}

/* v4 additions */
.mini-btn.today{width:42px;color:#ffd24a;border-color:#ffd24a55;font-size:10px;font-weight:800}
.mode-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;background:#0b0b18;border:1px solid #1e1e38;border-radius:12px}
.mode-head div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mode-head b{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;color:#00ffcc}
.mode-head span{font-size:12px;color:#6070a0}
.mode-head button{border:1px solid #00ffcc55;background:#06130f;color:#00ffcc;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
#habitRow{touch-action:manipulation}
#taskDueInput:disabled{opacity:.4}

/* ===== v6 RIGHT CHARGE: original charge.html wrapped as scaled iframe ===== */
#habitRow{gap:0}
#habitRow .habit-main{min-width:0}
#chargeMeter.charge-frame-shell{
  width:104px;height:100px;border-left:1px solid #1e1e38;
  background:#0a0a0f;display:block;position:relative;overflow:hidden;flex-shrink:0;
  touch-action:manipulation;cursor:pointer;
}
#chargeFrame{
  position:absolute;left:50%;top:50%;width:260px;height:260px;border:0;background:transparent;
  margin-left:-130px;margin-top:-130px;transform:scale(.385);transform-origin:center center;
}
#chargeMeter.charge-busy{box-shadow:inset 0 0 18px rgba(0,229,188,.12)}
#chargeMeter.charge-off{filter:brightness(.72) saturate(.82)}
#goBonusGate{position:absolute;inset:0;z-index:160;display:none;align-items:center;justify-content:center;background:rgba(50,50,55,.78);backdrop-filter:grayscale(1) blur(1px);-webkit-backdrop-filter:grayscale(1) blur(1px);touch-action:manipulation}
#goBonusGate.show{display:flex}.go-bonus-card{text-align:center;font-family:'Orbitron',monospace;transform:rotate(-4deg);animation:goPop .38s cubic-bezier(.12,1.6,.3,1) both}.go-bonus-main{font-size:58px;letter-spacing:2px;font-weight:900;color:#fff;text-shadow:4px 4px 0 #000,0 0 26px rgba(255,255,255,.75)}.go-bonus-sub{font-size:12px;letter-spacing:4px;color:#ffd24a;text-shadow:2px 2px 0 #000;margin-top:8px}@keyframes goPop{from{opacity:0;transform:scale(2.4) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
#bonusFrameOverlay{position:absolute;inset:0;z-index:170;background:#000;display:none;overflow:hidden}#bonusFrameOverlay.show{display:block}#bonusFrame{width:100%;height:100%;border:0;display:block;background:#000}

/* ===== v9 stability + polish ===== */
.task{padding:10px 10px 10px 12px;border-radius:12px;background:linear-gradient(180deg,#101022,#0b0b18);}
.task:not(.charging):not(.done){box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.task.done{opacity:.45;background:#080812;border-color:#13132a}
.task.done .task-name{text-decoration:none;color:#60708f}

.task-meta{margin-top:5px}.tag{opacity:.82}.tag.reward{display:none}
.dream{bottom:calc(var(--dock-h) + var(--safe-bottom) + 6px);background:linear-gradient(180deg,#131326,#0c0c19);border-color:#2d2740;border-left-color:#ffd24a;box-shadow:0 10px 35px rgba(0,0,0,.55),0 0 22px rgba(255,210,74,.08)}
.empty{padding:64px 20px}.empty-icon{font-size:32px;filter:drop-shadow(0 0 12px rgba(0,255,204,.24))}.empty-text{color:#6070a0;line-height:1.7}.empty-sub{font-size:12px;color:#36415e;margin-top:8px;line-height:1.7}
#rewardOverlay .popup.tier-white{border-color:#34364b}
#rewardOverlay .popup.tier-blue{border-color:#3b9eff88;box-shadow:0 0 0 1px #000,0 0 34px rgba(59,158,255,.18),0 20px 60px rgba(0,0,0,.7)}

#rewardOverlay .popup.tier-purple{border-color:#b96bff99;box-shadow:0 0 0 1px #000,0 0 42px rgba(185,107,255,.22),0 20px 60px rgba(0,0,0,.7)}
#rewardOverlay .popup.tier-red{border-color:#ff3b5caa;box-shadow:0 0 0 1px #000,0 0 48px rgba(255,59,92,.28),0 20px 60px rgba(0,0,0,.78)}
#rewardOverlay .popup.tier-gold{border-color:#ffd24a;box-shadow:0 0 0 1px #000,0 0 56px rgba(255,210,74,.42),0 24px 70px rgba(0,0,0,.85)}
#rewardOverlay .popup.tier-gold .rw-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,210,74,.20),transparent 45%);pointer-events:none}
.undo-toast{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + var(--safe-bottom) + 12px);z-index:95;background:#101022;border:1px solid #2b2b55;border-left:3px solid #00ffcc;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 38px rgba(0,0,0,.6);animation:undoIn .18s ease-out both}
.undo-toast span{flex:1;min-width:0;font-size:12px;color:#d8e7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.undo-toast button{border:1px solid #00ffcc66;background:#06130f;color:#00ffcc;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
@keyframes undoIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.backup-row{display:flex;gap:8px;margin-top:10px}.backup-row button{flex:1;height:36px;border-radius:10px;border:1px solid #23234a;background:#070712;color:#9ab0d0;font-size:12px;font-weight:700}

/* ===== v10 important/today + swipe polish ===== */
.task{touch-action:pan-y;overflow:hidden;transition:transform .16s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function charLen(t){return Array.from(String(t||'')).length}
function rawValue(){return document.getElementById('mi').value}
function vl(){return rawValue().trim()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function newId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'_'+String(Math.random()).slice(2)}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayStr(){return dateStr(new Date())}
function addDaysStr(base,delta){const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+delta);return dateStr(d)}
function yesterdayStr(){return addDaysStr(todayStr(),-1)}
function appDayStr(d=new Date()){const x=new Date(d);x.setHours(x.getHours()-5);return dateStr(x)}
function prevAppDayStr(){return addDaysStr(appDayStr(),-1)}
function isTaskToday(t){return !!(t&&t.dueDate===appDayStr())}
function isTaskImportant(t){return !!(t&&t.importantDate===appDayStr()&&isTaskToday(t))}
function syncTaskDateFlags(t){if(!t)return;const day=appDayStr();if(t.dueDate===day){t.todayDate=day}else{t.todayDate='';if(t.importantDate)t.importantDate='';if(t.swipeCycle&&t.swipeCycle<2)t.swipeCycle=0}}
function expireDailyFlags(target=state){
  const day=appDayStr();
  if(!target||!Array.isArray(target.tasks))return;
  target.tasks.forEach(t=>{
    syncTaskDateFlags(t);
    if(t.importantDate&&t.importantDate!==day)t.importantDate='';
    if(t.importantDate&&!isTaskToday(t))t.importantDate='';
  });
}
function importantCount(){expireDailyFlags(state);return state.tasks.filter(t=>t.state!=='done'&&isTaskImportant(t)).length}

function levelFromXp(xp){return Math.floor((Number(xp)||0)/LEVEL_STEP)}

function defaultTaskConfig(){return{name:'',dueDate:'',taskType:'normal',habitKind:'do',repeatType:'daily',intervalDays:1,weekdays:[]}}
function defaultHabitName(){return 'パチスロをしない'}
function defaultHabit(){return normalizeHabit({id:newId(),name:defaultHabitName(),habitKind:'avoid',createdAt:Date.now(),active:true})}
function normalizeTask(t){
  const done=t&&t.state==='done';
  return {
    id:(t&&t.id)||newId(),
    name:String((t&&t.name)||'').trim()||'無題タスク',
    state:['idle','charging','done'].includes(t&&t.state)?t.state:'idle',
    rewardDone:Boolean(t&&t.rewardDone)||(done&&!(t&&Object.prototype.hasOwnProperty.call(t,'rewardDone'))),
    scheduledAwarded:Boolean(t&&t.scheduledAwarded),
    createdAt:(t&&t.createdAt)||Date.now(),
    doneAt:(t&&t.doneAt)||null,
    dueDate:(t&&t.dueDate)||'',
    todayDate:(t&&t.todayDate)||'',
    importantDate:(t&&t.importantDate)||'',
    swipeCycle:Number(t&&t.swipeCycle)||0,
    taskType:'normal'
  };
}
function taskToHabit(t){return normalizeHabit({id:(t&&t.id)||newId(),name:(t&&t.name)||defaultHabitName(),habitKind:(t&&t.habitKind)||((t&&t.habit&&t.habit.mode)||'do'),createdAt:(t&&t.createdAt)||Date.now(),active:true})}
function normalizeHabit(h){
  return {
    id:(h&&h.id)||newId(),
    name:String((h&&h.name)||'').trim()||defaultHabitName(),
    habitKind:(h&&h.habitKind)==='avoid'?'avoid':'do',
    createdAt:(h&&h.createdAt)||Date.now(),
    active:h&&Object.prototype.hasOwnProperty.call(h,'active')?Boolean(h.active):true
  };
}
function normalizeLogs(logs){
  const out={};
  if(!logs||typeof logs!=='object')return out;
  Object.keys(logs).forEach(hid=>{
    if(!logs[hid]||typeof logs[hid]!=='object')return;
    out[hid]={};
    Object.keys(logs[hid]).forEach(day=>{
      const v=logs[hid][day];
      if(v&&typeof v==='object')out[hid][day]={status:v.status==='failed'?'failed':'done',checkedAt:v.checkedAt||Date.now(),rewardDone:!!v.rewardDone};
      else if(v)out[hid][day]={status:'done',checkedAt:Date.now()};
    });
  });
  return out;
}
function normalizeState(s){
  const out={version:APP_VERSION,profile:{name:'',titleId:null},xp:0,freeDays:0,ownedTitles:[],ownedIllusts:[],tasks:[],habits:[],habitLogs:{},chargeTickets:[],ui:{completedOpen:false,mode:'tasks'}};
  if(s&&typeof s==='object')Object.assign(out,s);
  out.profile=Object.assign({name:'',titleId:null},(s&&s.profile)||{});
  out.xp=Number(out.xp)||0;out.freeDays=Number(out.freeDays)||0;
  out.ownedTitles=Array.isArray(out.ownedTitles)?[...new Set(out.ownedTitles)]:[];
  out.ownedIllusts=Array.isArray(out.ownedIllusts)?[...new Set(out.ownedIllusts)]:[];
  const rawTasks=Array.isArray(out.tasks)?out.tasks:[];
  const normalTasks=[];
  const movedHabits=[];
  rawTasks.forEach(t=>{
    const isHabit=(t&&t.taskType)==='habit'||(t&&t.type)==='habit'||Boolean(t&&t.habit);
    if(isHabit)movedHabits.push(taskToHabit(t));
    else normalTasks.push(normalizeTask(t));
  });
  const existingHabits=Array.isArray(out.habits)?out.habits.map(normalizeHabit):[];
  const byId=new Map();
  existingHabits.concat(movedHabits).forEach(h=>{if(!byId.has(h.id))byId.set(h.id,h)});
  out.tasks=normalTasks;
  expireDailyFlags(out);
  out.habits=[...byId.values()];
  out.habitLogs=normalizeLogs(out.habitLogs);
  out.chargeTickets=Array.isArray(out.chargeTickets)?out.chargeTickets.filter(Boolean).map(x=>({id:(x&&x.id)||newId(),type:(x&&x.type)||'task',sourceId:(x&&x.sourceId)||'',name:(x&&x.name)||'',force:(x&&x.force)||null,createdAt:(x&&x.createdAt)||Date.now()})):[];
  out.ui=Object.assign({completedOpen:false,mode:'tasks'},(s&&s.ui)||{});
  if(out.ui.mode!=='habits')out.ui.mode='tasks';
  out.version=APP_VERSION;
  return out;
}
function safeParse(raw){try{return raw?JSON.parse(raw):null}catch(e){return null}}
function loadState(){
  for(const k of [STORAGE_KEY,...LEGACY_KEYS,BACKUP_KEY]){
    const parsed=safeParse(localStorage.getItem(k));
    if(parsed){
      state=normalizeState(parsed);
      if(!Object.prototype.hasOwnProperty.call(parsed,'habits')&&state.habits.length===0)state.habits.push(defaultHabit());
      saveNow();
      return;
    }
  }
  state=normalizeState(null);
  state.habits.push(defaultHabit());
}
function saveNow(){
  try{
    const old=localStorage.getItem(STORAGE_KEY);
    if(old)localStorage.setItem(BACKUP_KEY,old);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(normalizeState(state)));
  }catch(e){showToast('保存に失敗。空き容量を確認して')}
}

function rollTier(){const r=Math.random();if(r<0.47)return null;if(r<0.80)return 'white';return rollBonusTier()}
function rollBonusTier(){const b=Math.random();if(b<0.10)return 'white';if(b<0.29)return 'blue';if(b<0.61)return 'green';if(b<0.84)return 'purple';if(b<0.96)return 'red';return 'gold'}
function grantReward(tier){
  const T=TIERS[tier];const canIllust=tier!=='white'&&!state.ownedIllusts.includes(tier);const pool=['title','days'];if(canIllust)pool.push('illust');const type=rnd(pool);
  if(type==='illust'){state.ownedIllusts.push(tier);return{kind:'illust',tier}}
  if(type==='days'){state.freeDays+=T.days;return{kind:'days',tier,days:T.days}}
  const avail=TITLES.filter(t=>t.tier===tier&&!state.ownedTitles.includes(t.id));
  if(avail.length){const got=rnd(avail);state.ownedTitles.push(got.id);if(!state.profile.titleId)state.profile.titleId=got.id;return{kind:'title',tier,title:got}}
  state.xp+=T.xp;return{kind:'levelup',tier,xp:T.xp}
}

  ['mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,clearPress));
  el.addEventListener('contextmenu',e=>e.preventDefault());
  let clickTimer=null;
  el.addEventListener('click',e=>{if(e.target.closest('button'))return;e.stopPropagation();if(clickTimer){clearTimeout(clickTimer);clickTimer=null;flippedHabitId=flippedHabitId===h.id?null:h.id;render();return}clickTimer=setTimeout(()=>{clickTimer=null;if(flippedHabitId&&flippedHabitId!==h.id){flippedHabitId=null;render()}},230)});
  return el;
}
function todayTaskStats(){const todayTasks=state.tasks.filter(t=>isTaskToday(t)),done=todayTasks.filter(t=>t.state==='done').length;return{total:todayTasks.length,done,pending:Math.max(0,todayTasks.length-done),important:state.tasks.filter(t=>isTaskImportant(t)).length,items:todayTasks}}
function dotHtml(done,total){const max=5,filled=total?Math.round(done/total*max):0;let s='';for(let i=0;i<max;i++)s+='<span class="'+(i<filled?'dot-on':'dot-off')+'"></span>';return s}
function renderBottomBar(){
  const title=document.querySelector('.habit-title'),status=document.querySelector('.habit-status'),row=document.getElementById('habitRow');
  if(!title||!status||!row)return;
  row.setAttribute('aria-label',currentMode()==='tasks'?'習慣画面':'日常タスク画面');
  if(currentMode()==='habits'){
    const st=todayTaskStats(),sample=st.items.length?rnd(st.items):rnd(state.tasks.filter(t=>t.state!=='done'));
    title.textContent=sample?'DAILY TASK / '+sample.name:'DAILY TASK';
    status.innerHTML=dotHtml(st.done,st.total)+'<span class="counter">今日 '+st.done+'/'+st.total+' / 重要 '+(st.important||0)+'/2</span><span style="font-size:13px;color:#3a5070;margin-left:auto;">›</span>';
  }else{
    const st=habitStats(),sample=state.habits.length?rnd(state.habits):null;
    title.textContent=sample?'HABIT MODE / '+sample.name:'HABIT MODE';
    status.innerHTML=dotHtml(st.done,st.total)+'<span class="counter">習慣 '+st.total+' / 達成 '+st.done+'/'+st.total+'</span><span style="font-size:13px;color:#3a5070;margin-left:auto;">›</span>';
  }
  renderChargeMini();
}
function toggleMainMode(){if(chargeBusy)return;clearInlineDopaon(false);state.ui.mode=currentMode()==='tasks'?'habits':'tasks';taskChargingId=null;habitChargingId=null;flippedHabitId=null;saveState();render()}



function bonusRewardPayload(res){
  const T=TIERS[res.tier];
  if(res.kind==='title')return{kind:'称号 GET',text:'「'+res.title.text+'」',sub:'肩書きに追加された',tier:res.tier,color:T.color};
  if(res.kind==='days')return{kind:'無料期間 GET',text:'+'+res.days+'日',sub:'現在無料期間 +'+state.freeDays+'日 追加！',tier:res.tier,color:T.color};
  if(res.kind==='illust')return{kind:'イラスト GET',text:T.jp+'の一枚',sub:'プロフィールで見られる',tier:res.tier,color:T.color};
  return{kind:'レベルアップ',text:'+'+res.xp+' PT',sub:'Lv.'+levelFromXp(state.xp),tier:res.tier,color:T.color};
}
function postBonusRewardReady(payload,tries=0){
  const fr=document.getElementById('bonusFrame');
  if(fr&&fr.contentWindow){try{fr.contentWindow.postMessage({type:'DOPAON_BONUS_REWARD_READY',payload},'*');return true}catch(e){}}
  if(tries<20)setTimeout(()=>postBonusRewardReady(payload,tries+1),100);
  return false;
}

/* ===== v7 CHARGE BRIDGE: charge demo UI removed, original gimmick preserved ===== */
function issueChargeTicket(task,opts={}){
  if(!Array.isArray(state.chargeTickets))state.chargeTickets=[];
  state.chargeTickets.push({id:newId(),type:opts.type||'task',sourceId:task.id,name:task.name,force:opts.force||null,createdAt:Date.now()});
}
function chargeFrame(){return document.getElementById('chargeFrame')}
function chargeShell(){return document.getElementById('chargeMeter')}
function renderChargeMini(){
  const el=chargeShell();
  if(!el)return;
  el.classList.toggle('charge-busy',!!chargeBusy);
  el.classList.toggle('charge-off',!chargeBusy);
}
function tapChargeMini(e){
  if(e){e.preventDefault();e.stopPropagation()}
  // iframe内の元チャージがクリックを処理する。親側では何もしない。
}
function postToCharge(msg,tries=0){
  const fr=chargeFrame();
  if(fr&&fr.contentWindow){
    try{fr.contentWindow.postMessage(msg,'*');return true}catch(e){}
  }
  if(tries<20)setTimeout(()=>postToCharge(msg,tries+1),100);
  return false;
}
function resetChargeFrame(){postToCharge({type:'DOPAON_CHARGE_RESET'})}
function startNextChargeTicket(auto=false){
  if(chargeBusy)return false;
  if(!state.chargeTickets||!state.chargeTickets.length)return false;
  const ticket=state.chargeTickets.shift();
  saveState();
  chargeBusy=true;chargeCanInterrupt=true;
  renderChargeMini();
  postToCharge({type:'DOPAON_CHARGE_START',ticketId:ticket.id,force:ticket.force||null});
  return true;
}
async function handleChargeResult(kind){
  try{
    if(kind==='miss'){
      // たまに「惜しい！」をチャージ枠近くに出す
      if(Math.random()<0.3){
        const shell=document.getElementById('chargeMeter');
        if(shell){const m=document.createElement('div');m.className='miss-near';m.textContent=Math.random()<0.5?'惜しい！':'あと一歩！';shell.appendChild(m);requestAnimationFrame(()=>m.classList.add('pop'));setTimeout(()=>m.remove(),950);}
      }
      return;
    }
    if(kind==='white'||kind==='blue'){
      const reward=grantReward(kind);saveState();renderHeader();showReward(reward,kind==='blue'?'Tia青':'Tia白');return;
    }
    if(kind==='bonus'){
      await showGoBonusGate();
      const prepared=await playBonusFrame();
      // reward already shown in bonus.html
      return;
    }
  }finally{
    chargeBusy=false;chargeCanInterrupt=false;
    resetChargeFrame();
    renderChargeMini();
    saveState();
    if(state.chargeTickets&&state.chargeTickets.length)setTimeout(()=>startNextChargeTicket(true),260);
  }
}
function showGoBonusGate(){
  return new Promise(resolve=>{goBonusResolve=resolve;const el=document.getElementById('goBonusGate');if(el)el.classList.add('show');if(navigator.vibrate)navigator.vibrate([80,40,160])})
}
function tapGoBonusGate(e){if(e){e.preventDefault();e.stopPropagation()}const el=document.getElementById('goBonusGate');if(el)el.classList.remove('show');const r=goBonusResolve;goBonusResolve=null;r&&r()}
let bonusPreparedReward=null;
function playBonusFrame(){
  return new Promise(resolve=>{
    bonusResolve=resolve;bonusPreparedReward=null;
    const ov=document.getElementById('bonusFrameOverlay'),fr=document.getElementById('bonusFrame');
    if(!ov||!fr){const r=grantReward(rollBonusTier());saveState();renderHeader();resolve(r);return}
    ov.classList.add('show');
    const send=()=>{try{fr.contentWindow.postMessage({type:'DOPAON_BONUS_START'},'*')}catch(e){const r=grantReward(rollBonusTier());saveState();renderHeader();resolve(r)}};
    if(fr.contentWindow)send(); else fr.onload=send;
  })
}
document.addEventListener('click',e=>{if(currentMode()==='habits'&&flippedHabitId&&!e.target.closest('.habit-tile')){flippedHabitId=null;render()}},true);
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='DOPAON_CHARGE_STATE'){chargeCanInterrupt=(d.phase==='rolling'||d.phase==='miss');return}
  if(d.type==='DOPAON_CHARGE_RESULT'){
    const kind=['miss','white','blue','bonus'].includes(d.kind)?d.kind:'miss';
    handleChargeResult(kind);
    return;
  }
  if(d.type==='DOPAON_BONUS_PREPARE_REWARD'){
    const tier=TIER_ORDER.includes(d.tier)?d.tier:rollBonusTier();
    const reward=grantReward(tier);bonusPreparedReward=reward;saveState();renderHeader();
    postBonusRewardReady(bonusRewardPayload(reward));
    return;
  }
  if(d.type==='DOPAON_BONUS_CLOSE'){
    const ov=document.getElementById('bonusFrameOverlay');if(ov)ov.classList.remove('show');
    const r=bonusResolve;bonusResolve=null;r&&r(bonusPreparedReward);
    bonusPreparedReward=null;
    return;
  }
  if(d.type==='DOPAON_BONUS_RESULT'){
    const tier=TIER_ORDER.includes(d.tier)?d.tier:rollBonusTier();
    const reward=bonusPreparedReward||grantReward(tier);saveState();renderHeader();
    const ov=document.getElementById('bonusFrameOverlay');if(ov)ov.classList.remove('show');
    const r=bonusResolve;bonusResolve=null;r&&r(reward);bonusPreparedReward=null;
  }
});

function handleViewportChange(){syncViewport();setTimeout(syncViewport,60);setTimeout(syncViewport,180)}
if(window.visualViewport){visualViewport.addEventListener('resize',handleViewportChange);visualViewport.addEventListener('scroll',handleViewportChange)}
window.addEventListener('resize',()=>{initBaseViewport(false);syncViewport()});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{initBaseViewport(true);syncViewport()},300);setTimeout(syncViewport,700)});
window.addEventListener('scroll',lockScroll,{passive:true});
document.addEventListener('touchmove',e=>{if(e.target.closest('#ta'))return;if(e.target.closest('.popup'))return;e.preventDefault()},{passive:false});


/* ===== onboarding ===== */
const OB_PAGES=[
  {icon:'⚡',title:'タスクを完了しよう',body:'タスクを入力して追加。<br>完了ボタンを2回タップするとガチャが回って報酬が手に入る。'},
  {icon:'🎰',title:'チャージで報酬ゲット',body:'上のバーにあるのがチャージ機。<br>タスクを終わらせるたびに回って、称号・日数・イラストが当たる。'},
  {icon:'🎁',title:'無料期間って何？',body:'ヘッダーに表示される「+◯日」は、<br>将来の有料機能を無料で使える日数。<br>タスクをこなすほど増えていく。'},
  {icon:'↕',title:'習慣バーを使おう',body:'上のバー左側をタップすると習慣画面へ。<br>「やる」or「やらない」を毎日記録すると<br>チャージが必ず当たる。'},
  {icon:'👆',title:'スワイプで操作',body:'右へ引くと今日/重要をプレビュー。<br>離した瞬間に確定。左へ引くと編集・削除メニューが開く。'},
]
let _obPage=0;
function _obRender(){
  const el=document.getElementById('onboardBody');if(!el)return;
  const p=OB_PAGES[_obPage],n=OB_PAGES.length;
  el.innerHTML='<div class="ob-icon">'+p.icon+'</div>'
    +'<div class="ob-title">'+p.title+'</div>'
    +'<div class="ob-body">'+p.body.replace(/\n/g,'<br>')+'</div>'
    +'<div class="ob-dots">'+OB_PAGES.map((_,i)=>'<div class="ob-dot'+(i===_obPage?' on':'')+'" style="width:7px;height:7px;border-radius:50%;background:'+(i===_obPage?'#00ffcc':'#2a3a55')+'"></div>').join('')+'</div>'
    +'<button class="ob-next" onclick="_obNext()">'+(_obPage<n-1?'次へ →':'はじめる！')+'</button>';
}
function _obNext(){
  if(_obPage<OB_PAGES.length-1){_obPage++;_obRender();}
  else{state.onboarded=true;saveState();document.getElementById('onboardOverlay').classList.remove('show');}
}
function checkOnboarding(){if(!state.onboarded){_obPage=0;_obRender();document.getElementById('onboardOverlay').classList.add('show');}}
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations
    ? navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})
    : navigator.serviceWorker.ready.then(r=>r.unregister()).catch(()=>{});
}
loadState();initBaseViewport(true);syncViewport();renderHeader();render();renderChargeMini();resetPraiseInput();
checkOnboarding();
