<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="theme-color" content="#07070f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DOPAON" />
<meta name="mobile-web-app-capable" content="yes" />

<title>DOPAON TASK SYSTEM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Reggae+One&family=Orbitron:wght@700;900&display=swap');

:root{
  --app-top:0px;
  --app-h:100vh;
  --kb:0px;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);

  --header-h:60px;
  --dock-h:158px;
  --input-h:58px;
  --habit-h:100px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020208;
  font-family:system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}

body{
  position:fixed;
  inset:0;
  touch-action:manipulation;
}

#sf8{
  position:fixed;
  top:var(--app-top);
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:var(--app-h);
  background:#07070f;
  color:#c8d8f0;
  overflow:hidden;
  border-left:1px solid #1e1e38;
  border-right:1px solid #1e1e38;
}

/* ============ HEADER ============ */
.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:30;
  height:calc(var(--safe-top) + var(--header-h));
  padding:var(--safe-top) 12px 0 14px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#07070f;
  border-bottom:1px solid #1e1e38;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  flex-shrink:0;
}

.logo{
  font-family:'Orbitron',monospace;
  font-size:13px;
  font-weight:900;
  letter-spacing:2.5px;
  color:#00ffcc;
  line-height:1;
}

.sub{
  font-family:'Orbitron',monospace;
  font-size:6px;
  color:#00ffcc44;
  letter-spacing:3px;
}

.identity{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:flex-end;
  cursor:pointer;
  padding:6px 4px;
  border-radius:10px;
  transition:background .15s;
}
.identity:active{background:#0f0f20}

.id-text{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}

.id-name{
  font-size:13px;
  font-weight:600;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:170px;
}
.id-name .ttl{font-weight:500}

.id-lv{
  font-family:'Orbitron',monospace;
  font-size:8px;
  letter-spacing:1px;
  color:#4a6080;
  display:flex;
  align-items:center;
  gap:5px;
}
.id-lv b{color:#ffd24a;font-weight:700}
.id-lv .free{color:#00ffcc}

.id-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1.5px solid #2a2a50;
  background:#0f0f20;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

/* ============ TASK AREA ============ */
#ta{
  position:absolute;
  top:calc(var(--safe-top) + var(--header-h));
  bottom:calc(var(--dock-h) + var(--safe-bottom));
  left:0;
  right:0;
  overflow-y:auto;
  padding:12px 14px;
  -webkit-overflow-scrolling:touch;
  z-index:5;
}

#pc{
  position:absolute;
  top:calc(var(--safe-top) + var(--header-h));
  bottom:0;
  left:0;
  right:0;
  pointer-events:none;
  overflow:hidden;
  z-index:40;
  transform:translateZ(0);
}

/* ============ DOCK ============ */
#bottomDock{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:calc(var(--dock-h) + var(--safe-bottom));
  z-index:35;
  transform:translate3d(0,calc(var(--kb) * -1),0);
  transition:transform .18s ease-out;
  will-change:transform;
  background:#07070f;
}

#habitRow{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:var(--habit-h);
  border-top:1px solid #1e1e38;
  display:flex;
  background:#07070f;
}

#inputBar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:calc(var(--input-h) + var(--safe-bottom));
  padding:8px 12px calc(8px + var(--safe-bottom));
  border-top:1px solid #1e1e38;
  background:#07070f;
  display:flex;
  align-items:center;
  gap:10px;
}

#mi{
  flex:1;
  min-width:0;
  height:38px;
  border:1px solid #1e1e38;
  border-radius:19px;
  background:#0f0f20;
  padding:0 14px;
  font-size:16px;
  color:#c8d8f0;
  font-family:system-ui,sans-serif;
  letter-spacing:.5px;
}
#mi::placeholder{color:#2a3a55}
#mi:focus{outline:none}

.roundBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:all .15s;
  font-size:18px;
  line-height:1;
}
.bolt{border:1.5px solid #2a2a50;background:transparent;color:#6070a0}
.dopa{border:none;background:#c8a020;color:#07070f;opacity:.4}

.habit-main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 18px;
  gap:10px;
  overflow:hidden;
  cursor:pointer;
}
.habit-title{
  font-size:14px;
  color:#ddeeff;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.habit-status{display:flex;gap:7px;align-items:center}
.dot-on,.dot-off{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-on{background:#00ffcc}
.dot-off{background:transparent;border:1.5px solid #2a3a55}
.counter{font-family:'Orbitron',monospace;font-size:8px;color:#4a6080;margin-left:4px;letter-spacing:1px}

.meter{
  width:100px;
  height:100px;
  border-left:1px solid #1e1e38;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  cursor:pointer;
  position:relative;
}

/* ============ TASK CARDS ============ */
.empty{text-align:center;padding:80px 20px;color:#2a3a55}
.empty-icon{font-size:24px;margin-bottom:10px}
.empty-text{font-size:14px}

.task{
  background:#0f0f20;
  border:1px solid #1e1e38;
  border-radius:10px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.task.charging{border-color:#ffd700}
.task.done{opacity:.35}

.task-name{flex:1;font-size:14px;line-height:1.4;color:#c8d8f0;word-break:break-word}
.task.done .task-name{color:#3a4060;text-decoration:line-through}

.task-action{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.task-btn{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid #2a2a50;background:transparent;color:#3a3a65;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.task.charging .task-btn{border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700}
.push{font-family:'Orbitron',monospace;font-size:7px;color:#ffd700;letter-spacing:.5px}
.done-mark{font-size:16px;color:#39ff14;flex-shrink:0}

.completed{margin-top:12px;padding-top:10px;border-top:1px solid #111122}
.completed p{font-family:'Orbitron',monospace;font-size:8px;color:#2a3a55;letter-spacing:2px;margin:0 0 8px}

.dream{
  position:absolute;
  left:12px;right:12px;
  bottom:calc(var(--dock-h) + var(--safe-bottom) + 8px);
  background:#0f0f20;
  border:1px solid #1e1e38;
  border-left:3px solid #c8a020;
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;color:#ddeeff;font-weight:500;
  text-align:center;line-height:1.8;
  z-index:50;pointer-events:none;
  box-shadow:0 10px 32px rgba(0,0,0,.45);
}
.dream-time{
  display:block;
  font-family:'Orbitron',monospace;
  font-size:8px;
  letter-spacing:2px;
  color:#c8a020;
  margin-bottom:4px;
}
.dream-quote{
  display:block;
}

@keyframes tslide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.5}}
.tnew{animation:tslide .2s ease-out}
.cbtn{animation:cpulse 1s ease-in-out infinite}

/* ============ OVERLAY / POPUP ============ */
.overlay{
  position:absolute;
  inset:0;
  z-index:60;
  background:rgba(2,2,8,.72);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease-out;
}
.overlay.show{opacity:1;pointer-events:auto}

.popup{
  width:100%;
  max-width:380px;
  max-height:100%;
  overflow-y:auto;
  background:#0b0b18;
  border:1px solid #23234a;
  border-radius:18px;
  box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.7);
  transform:translateY(12px) scale(.97);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
.overlay.show .popup{transform:translateY(0) scale(1)}

.popup-head{
  position:sticky;
  top:0;
  background:#0b0b18;
  display:flex;
  align-items:center;
  padding:16px 16px 12px;
  border-bottom:1px solid #181835;
  z-index:2;
}
.popup-title{
  font-family:'Orbitron',monospace;
  font-size:11px;
  letter-spacing:3px;
  color:#00ffcc;
  font-weight:700;
  flex:1;
}
.popup-close{
  width:30px;height:30px;border-radius:50%;
  border:1px solid #23234a;background:transparent;color:#6070a0;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.popup-body{padding:16px}

/* profile */
.field-label{
  font-family:'Orbitron',monospace;
  font-size:8px;letter-spacing:2px;color:#4a6080;
  margin:0 0 8px;text-transform:uppercase;
}
.section{margin-bottom:22px}

.name-input{
  width:100%;height:42px;
  border:1px solid #23234a;border-radius:10px;
  background:#06060e;color:#eaf2ff;
  padding:0 14px;font-size:16px;letter-spacing:.5px;
  font-family:system-ui,sans-serif;
}
.name-input:focus{outline:none;border-color:#00ffcc55}

.stat-row{display:flex;gap:10px}
.stat-box{
  flex:1;
  background:#06060e;
  border:1px solid #1a1a35;
  border-radius:10px;
  padding:12px 10px;
  text-align:center;
}
.stat-num{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1}
.stat-num.lv{color:#ffd24a}
.stat-num.free{color:#00ffcc}
.stat-cap{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1.5px;color:#4a6080;margin-top:6px}

.free-note{
  margin-top:10px;
  background:#06130f;
  border:1px solid #00ffcc22;
  border-radius:10px;
  padding:10px 12px;
  text-align:center;
  color:#00ffcc;
  font-size:13px;
  font-weight:700;
}

.preview-name{
  text-align:center;
  font-size:17px;
  padding:14px;
  background:#06060e;
  border:1px solid #1a1a35;
  border-radius:10px;
  line-height:1.5;
}
.preview-name .pv-ttl{font-weight:500}
.preview-name .pv-nm{font-weight:700;color:#eaf2ff}
.preview-name .pv-empty{color:#3a4060;font-size:13px}

/* title chips */
.title-grid{display:flex;flex-wrap:wrap;gap:7px}
.title-chip{
  font-size:12px;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid #23234a;
  background:#06060e;
  color:#56607e;
  cursor:default;
  transition:all .12s;
  white-space:nowrap;
}
.title-chip.owned{cursor:pointer;color:#c8d8f0}
.title-chip.owned:active{transform:scale(.95)}
.title-chip.locked{opacity:.4}
.title-chip.sel{
  border-width:1.5px;
  font-weight:600;
  box-shadow:0 0 10px -2px currentColor;
}
.title-none{
  font-size:12px;color:#56607e;
  border:1px dashed #23234a;border-radius:999px;
  padding:7px 11px;cursor:pointer;background:#06060e;
}
.title-none.sel{border-style:solid;border-color:#00ffcc;color:#00ffcc}

/* illust grid */
.illust-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.illust-cell{
  position:relative;
  aspect-ratio:1;
  border-radius:10px;
  border:1px solid #1a1a35;
  background:#06060e;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.illust-cell.locked{opacity:.85}
.illust-cell .lockmark{
  font-size:15px;color:#2a3550;
}
.illust-cell svg{width:100%;height:100%;display:block}
.illust-cap{
  font-family:'Orbitron',monospace;
  font-size:6px;letter-spacing:1px;
  text-align:center;margin-top:4px;color:#4a6080;
}

/* ============ REWARD POPUP ============ */
#rewardOverlay .popup{
  max-width:300px;
  text-align:center;
  border-color:#23234a;
}
.rw-stage{
  padding:30px 22px 26px;
  position:relative;
}
.rw-tier-label{
  font-family:'Orbitron',monospace;
  font-size:10px;letter-spacing:4px;font-weight:700;
  margin-bottom:18px;
}
.rw-icon{
  width:108px;height:108px;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
}
.rw-icon svg{width:100%;height:100%}
.rw-reward-type{
  font-family:'Orbitron',monospace;
  font-size:8px;letter-spacing:2px;color:#4a6080;margin-bottom:8px;
}
.rw-reward-main{
  font-size:22px;font-weight:700;line-height:1.4;color:#eaf2ff;
  margin-bottom:6px;
}
.rw-reward-sub{font-size:13px;color:#8898b8}
.rw-tap{
  font-family:'Orbitron',monospace;
  font-size:8px;letter-spacing:2px;color:#3a4565;
  margin-top:22px;
}

@keyframes rwpop{
  0%{transform:scale(.3);opacity:0}
  60%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}
@keyframes rwglow{
  0%,100%{filter:drop-shadow(0 0 6px currentColor)}
  50%{filter:drop-shadow(0 0 20px currentColor)}
}
.rw-icon.animate{animation:rwpop .5s cubic-bezier(.2,.9,.3,1.3),rwglow 1.6s ease-in-out infinite .5s}
</style>
</head>

<body>
<div id="sf8">
  <div id="pc"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <span class="logo">DOPAON</span>
      <span class="sub">TASK SYS</span>
    </div>
    <div class="identity" id="identity" onclick="openProfile()">
      <div class="id-text">
        <div class="id-name" id="hdName"></div>
        <div class="id-lv">
          <span>Lv.<b id="hdLv">0</b></span>
          <span class="free" id="hdFree">+0日</span>
        </div>
      </div>
      <div class="id-avatar">👤</div>
    </div>
  </div>

  <!-- TASKS -->
  <div id="ta"></div>

  <!-- DOCK -->
  <div id="bottomDock">
    <div id="habitRow">
      <div class="habit-main">
        <span class="habit-title">パチスロをしない</span>
        <div class="habit-status">
          <span class="dot-on"></span>
          <span class="dot-off"></span>
          <span class="dot-off"></span>
          <span class="counter">1/3</span>
          <span style="font-size:13px;color:#3a5070;margin-left:auto;">›</span>
        </div>
      </div>

      <div class="meter" id="chargeMeter">
        <svg width="82" height="82" viewBox="0 0 82 82" aria-hidden="true">
          <circle cx="41" cy="41" r="36" fill="none" stroke="#181830" stroke-width="5" stroke-dasharray="3.5 2.2"/>
          <circle cx="41" cy="41" r="36" fill="none" stroke="#39ff14" stroke-width="5" stroke-dasharray="143 83" transform="rotate(-90 41 41)"/>
          <circle cx="41" cy="41" r="28" fill="#0e0e1c" stroke="#252545" stroke-width="1.5"/>
          <circle cx="41" cy="41" r="24" fill="#06060e"/>
          <line x1="31" y1="31" x2="35" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="31" y1="31" x2="31" y2="35" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="51" y1="31" x2="47" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="51" y1="31" x2="51" y2="35" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="31" y1="51" x2="35" y2="51" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="31" y1="51" x2="31" y2="47" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="51" y1="51" x2="47" y2="51" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="51" y1="51" x2="51" y2="47" stroke="#00ffcc" stroke-width="1.5"/>
          <text x="41" y="39" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00ffcc">DO</text>
          <text x="41" y="50" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00ffcc" opacity=".7">DO!!</text>
        </svg>
      </div>
    </div>

    <div id="inputBar">
      <button id="ib" class="roundBtn bolt" onclick="doInst()" aria-label="即タスク化">⚡</button>
      <input
        id="mi" type="text" placeholder="タスクを入力..."
        autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"
        oninput="onIn(event)" onbeforeinput="onBeforeInput(event)" onkeydown="onKey(event)"
        oncompositionstart="onCompStart(event)" oncompositionupdate="onCompUpdate(event)" oncompositionend="onCompEnd(event)"
        onfocus="onInputFocus()" onblur="onInputBlur()"
      />
      <button id="db" class="roundBtn dopa" onclick="doDopa()" aria-label="DOPAON!">✦</button>
    </div>
  </div>

  <!-- PROFILE POPUP -->
  <div class="overlay" id="profileOverlay">
    <div class="popup">
      <div class="popup-head">
        <span class="popup-title">PROFILE</span>
        <button class="popup-close" onclick="closeProfile()" aria-label="閉じる">✕</button>
      </div>
      <div class="popup-body">

        <div class="section">
          <div class="preview-name" id="namePreview"></div>
        </div>

        <div class="section">
          <p class="field-label">名前</p>
          <input class="name-input" id="nameInput" type="text" maxlength="12"
            placeholder="名前を入力" oninput="onNameInput()" autocomplete="off" />
        </div>

        <div class="section">
          <div class="stat-row">
            <div class="stat-box">
              <div class="stat-num lv" id="pfLv">0</div>
              <div class="stat-cap">LEVEL</div>
            </div>
            <div class="stat-box">
              <div class="stat-num free" id="pfFree">+0日</div>
              <div class="stat-cap">FREE BONUS</div>
            </div>
          </div>
          <div class="free-note" id="pfFreeNote">現在無料期間 +0日 追加！</div>
        </div>

        <div class="section">
          <p class="field-label">肩書き <span id="titleCount" style="color:#2a3a55"></span></p>
          <div class="title-grid" id="titleGrid"></div>
        </div>

        <div class="section" style="margin-bottom:6px">
          <p class="field-label">イラスト</p>
          <div class="illust-grid" id="illustGrid"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- REWARD POPUP -->
  <div class="overlay" id="rewardOverlay" onclick="closeReward()">
    <div class="popup" onclick="event.stopPropagation()">
      <div class="rw-stage">
        <div class="rw-tier-label" id="rwTierLabel"></div>
        <div class="rw-icon" id="rwIcon"></div>
        <div class="rw-reward-type" id="rwType"></div>
        <div class="rw-reward-main" id="rwMain"></div>
        <div class="rw-reward-sub" id="rwSub"></div>
        <div class="rw-tap">TAP TO CLOSE</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ===================================================================
   DOPAON TASK SYSTEM

/* ---------- 状態 ---------- */
const STORAGE_KEY='dopaon_state_v2';

let state={
  profile:{name:'',titleId:null},
  xp:0,
  freeDays:0,
  ownedTitles:[],
  ownedIllusts:[],
  tasks:[]
};

function levelFromXp(xp){return Math.floor((Number(xp)||0)/6)}

function normalizeState(s){
  const base={
    profile:{name:'',titleId:null},
    xp:0,
    freeDays:0,
    ownedTitles:[],
    ownedIllusts:[],
    tasks:[]
  };

  const out=Object.assign({},base,s||{});
  out.profile=Object.assign({},base.profile,(s&&s.profile)||{});
  out.xp=Number(out.xp)||0;
  out.freeDays=Number(out.freeDays)||0;
  out.ownedTitles=Array.isArray(out.ownedTitles)?out.ownedTitles:[];
  out.ownedIllusts=Array.isArray(out.ownedIllusts)?out.ownedIllusts:[];
  out.tasks=Array.isArray(out.tasks)?out.tasks:[];

  out.tasks=out.tasks
    .filter(t=>t&&typeof t.name==='string')
    .map(t=>({
      id:t.id||newId(),
      name:t.name,
      state:['idle','charging','done'].includes(t.state)?t.state:'idle'
    }));

  return out;
}

function loadState(){
  try{
    const rawV2=localStorage.getItem(STORAGE_KEY);
    const rawV1=localStorage.getItem('dopaon_state_v1');
    const raw=rawV2||rawV1;
    if(!raw)return;
    state=normalizeState(JSON.parse(raw));
    saveState();
  }catch(e){
    state=normalizeState(null);
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){}
}

/* ---------- 汎用 ---------- */
const NS="http://www.w3.org/2000/svg";
const FF="'Reggae One', system-ui, sans-serif";

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function charLen(t){return Array.from(String(t||"")).length}
function rawValue(){return document.getElementById("mi").value}
function vl(){return rawValue().trim()}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function newId(){
  return window.crypto&&typeof window.crypto.randomUUID==="function"
    ? window.crypto.randomUUID()
    : String(Date.now())+"_"+String(Math.random()).slice(2);
}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}

/* ---------- 抽選 ---------- */
function rollTier(){
  const r=Math.random();
  if(r<0.47)return null;
  if(r<0.80)return 'white';

  const b=Math.random();
  if(b<0.15)return 'white';
  if(b<0.45)return 'blue';
  if(b<0.70)return 'green';
  if(b<0.88)return 'purple';
  if(b<0.97)return 'red';
  return 'gold';
}

function grantReward(tier){
  const T=TIERS[tier];
  const canIllust=tier!=='white' && !state.ownedIllusts.includes(tier);

  const pool=['title','days'];
  if(canIllust)pool.push('illust');

  const type=rnd(pool);

  if(type==='illust'){
    state.ownedIllusts.push(tier);
    return {kind:'illust',tier};
  }

  if(type==='days'){
    state.freeDays+=T.days;
    return {kind:'days',tier,days:T.days};
  }

  const avail=TITLES.filter(t=>t.tier===tier && !state.ownedTitles.includes(t.id));
  if(avail.length){
    const got=rnd(avail);
    state.ownedTitles.push(got.id);
    if(!state.profile.titleId)state.profile.titleId=got.id;
    return {kind:'title',tier,title:got};
  }

  state.xp+=T.xp;
  return {kind:'levelup',tier,xp:T.xp};
}

function runReward(){
  const tier=rollTier();

  /* ハズレは完全サイレント。結果報告もバイブもなし。 */
  if(!tier)return;

  const result=grantReward(tier);
  saveState();
  renderHeader();
  showReward(result);
}

}

function showReward(res){
  const ov=document.getElementById('rewardOverlay');
  const icon=document.getElementById('rwIcon');
  const tierLabel=document.getElementById('rwTierLabel');
  const typeEl=document.getElementById('rwType');
  const mainEl=document.getElementById('rwMain');
  const subEl=document.getElementById('rwSub');

  const T=TIERS[res.tier];

  tierLabel.textContent=T.jp+' TIER';
  tierLabel.style.color=T.color;
  icon.innerHTML=tierIconSVG(res.tier);

  mainEl.style.color='';
  mainEl.innerHTML='';
  subEl.textContent='';

  if(res.kind==='title'){
    typeEl.textContent='称号 GET';
    mainEl.innerHTML='「<span style="color:'+T.color+'">'+escapeHtml(res.title.text)+'</span>」';
    subEl.textContent='肩書きに追加された';
  }else if(res.kind==='days'){
    typeEl.textContent='無料期間 GET';
    mainEl.textContent='+'+res.days+'日';
    mainEl.style.color=T.color;
    subEl.textContent='現在無料期間 +'+state.freeDays+'日 追加！';
  }else if(res.kind==='illust'){
    typeEl.textContent='イラスト GET';
    mainEl.textContent=T.jp+'の一枚';
    mainEl.style.color=T.color;
    subEl.textContent='プロフィールで見られる';
  }else if(res.kind==='levelup'){
    typeEl.textContent='レベルアップ';
    mainEl.textContent='+'+res.xp+' XP';
    mainEl.style.color=T.color;
    subEl.textContent='Lv.'+levelFromXp(state.xp);
  }

  ov.classList.add('show');
  icon.classList.remove('animate');
  void icon.offsetWidth;
  icon.classList.add('animate');

  if(navigator.vibrate){
    if(res.tier==='gold'||res.tier==='red')navigator.vibrate([60,40,60,40,140]);
    else navigator.vibrate(50);
  }
}

}

/* ===================================================================
   DOPAON メッセージ
=================================================================== */
function makeDopaonMessage(taskName){
  const isAfter=Math.random()<0.8;
  const item=isAfter?rnd(DOPAON_AFTER):rnd(DOPAON_QUOTES);
  const clean=taskName?taskName.trim():'そのタスク';

  let text=item.text.replaceAll('{task}',clean);
  if(taskName && isAfter && Math.random()<0.35){
    text='「'+clean+'」を終わらせた後、'+text;
  }

  return{
    time:item.time,
    text
  };
}

function showDopaonMessage(taskName){
  const msg=makeDopaonMessage(taskName);
  const el=document.createElement("div");

  el.className="dream";
  el.innerHTML=
    '<span class="dream-time">'+escapeHtml(msg.time)+'</span>'+
    '<span class="dream-quote">「'+escapeHtml(msg.text)+'」</span>';

  document.getElementById("sf8").appendChild(el);

  el.animate(
    [
      {opacity:0,transform:"translateY(6px) scale(.98)"},
      {opacity:1,transform:"translateY(0) scale(1)",offset:.1},
      {opacity:1,offset:.82},
      {opacity:0,transform:"translateY(-8px) scale(.98)"}
    ],
    {duration:3600,fill:"forwards",easing:"cubic-bezier(.18,.8,.22,1)"}
  ).onfinish=()=>{
    if(el.parentNode)el.parentNode.removeChild(el);
  };
}

/* ===================================================================
   甘やかし演出 + 入力まわり
=================================================================== */
let isComposing=false;
let compBaseLen=0;
let compText="";
let observedLen=0;

let livePraise=0;
let praiseQueue=0;
let praiseDrainTimer=null;
let busyLanes=new Set();
let activePraise=new Set();

let baseViewportHeight=0;

const PRAISE_LIFE=2000;
const MAX_PRAISE=4;
const PRAISE_COOLDOWN=95;
const MAX_PRAISE_QUEUE=12;
const P_MARGIN=10;

function viewportHeight(){return window.visualViewport?window.visualViewport.height:window.innerHeight}
function viewportTop(){return window.visualViewport?window.visualViewport.offsetTop:0}

function initBaseViewport(force){
  const h=Math.max(window.innerHeight,viewportHeight());

  if(force||!baseViewportHeight){
    baseViewportHeight=h;
    return;
  }

  const inputFocused=document.activeElement===document.getElementById("mi");

  if(!inputFocused&&h>baseViewportHeight){
    baseViewportHeight=h;
  }
}

function syncViewport(){
  initBaseViewport(false);

  const vvTop=viewportTop();
  const vvH=viewportHeight();
  const inputFocused=document.activeElement===document.getElementById("mi");
  const rawLift=baseViewportHeight-vvH;
  const lift=inputFocused?Math.max(0,Math.round(rawLift)):0;

  document.documentElement.style.setProperty("--app-top",Math.round(vvTop)+"px");
  document.documentElement.style.setProperty("--app-h",Math.round(baseViewportHeight)+"px");
  document.documentElement.style.setProperty("--kb",lift+"px");

  lockScroll();
}

function lockScroll(){
  if(window.scrollX!==0||window.scrollY!==0)window.scrollTo(0,0);
}

function isSideMark(ch){
  return /[！!？?‼⁉⁈♡♥❤★☆♪♫♬〜ー…‥・。、,.，．]/.test(ch);
}

function grps(txt){
  const cs=Array.from(txt);
  const gs=[];
  let i=0;

  while(i<cs.length){
    if(isSideMark(cs[i])){
      let j=i;
      while(j<cs.length&&isSideMark(cs[j]))j++;
      gs.push({side:true,t:cs.slice(i,j).join("")});
      i=j;
    }else{
      gs.push({side:false,t:cs[i]});
      i++;
    }
  }

  return gs;
}

function textSize(mode){
  if(mode==="done")return 26+Math.floor(Math.random()*7);
  if(mode==="add")return 22+Math.floor(Math.random()*7);
  return 17+Math.floor(Math.random()*8);
}

function getTextBox(groups,fs){
  const pad=Math.ceil(fs*.55);
  const lh=Math.ceil(fs*1.34);
  const maxMark=groups.reduce((m,g)=>g.side?Math.max(m,charLen(g.t)):m,1);

  return{
    w:Math.ceil(Math.max(fs,maxMark*fs*.62)+pad*2),
    h:Math.ceil(groups.length*lh+pad),
    pad,
    lh
  };
}

function txPair(svg,x,y,fs,txt,col){
  const outer=Math.max(4,fs*.24);
  const inner=Math.max(2,fs*.11);

  [["none","white",outer],[col,"#111",inner]].forEach(([fill,stroke,sw])=>{
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",x);
    t.setAttribute("y",y);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.setAttribute("font-family",FF);
    t.setAttribute("font-size",fs);
    t.setAttribute("font-weight","900");
    t.setAttribute("fill",fill);
    t.setAttribute("stroke",stroke);
    t.setAttribute("stroke-width",sw);
    t.setAttribute("stroke-linejoin","round");
    if(fill!=="none")t.setAttribute("paint-order","stroke");
    t.textContent=txt;
    svg.appendChild(t);
  });
}

function drawPraiseText(svg,item,groups,box,fs){
  let cy=box.pad/2+box.lh/2;

  groups.forEach(g=>{
    const len=Math.max(1,charLen(g.t));
    const fitFs=g.side?Math.min(fs,Math.max(10,(box.w-box.pad*.65)/(len*.62))):fs;

    txPair(svg,box.w/2,cy,fitFs,g.t,item.c);
    cy+=box.lh;
  });
}

function getPraiseOrigin(){
  const pc=document.getElementById("pc");
  const dock=document.getElementById("bottomDock");

  if(!pc||!dock)return{x:180,y:360};

  const pcRect=pc.getBoundingClientRect();
  const dockRect=dock.getBoundingClientRect();

  return{
    x:clamp(dockRect.left+dockRect.width/2-pcRect.left,48,pc.clientWidth-48),
    y:clamp(dockRect.top-pcRect.top+20,pc.clientHeight*.55,pc.clientHeight+86)
  };
}

function getLanes(origin){
  const pc=document.getElementById("pc");
  const count=pc.clientWidth<360?5:7;
  const topY=18;
  const minX=38;
  const maxX=pc.clientWidth-38;
  const lanes=[];

  for(let i=0;i<count;i++){
    const targetX=count===1?pc.clientWidth/2:minX+(maxX-minX)*(i/(count-1));
    const dx=targetX-origin.x;
    const dy=topY-origin.y;

    lanes.push({
      index:i,
      angle:Math.atan2(dy,dx)*180/Math.PI,
      len:Math.hypot(dx,dy)
    });
  }

  return lanes;
}

function getPointOnLane(origin,lane,d){
  const r=lane.angle*Math.PI/180;
  return{
    x:origin.x+Math.cos(r)*d,
    y:origin.y+Math.sin(r)*d
  };
}

function fitsInPraiseArea(x,y,w,h){
  const pc=document.getElementById("pc");
  return(
    x-w/2>P_MARGIN &&
    x+w/2<pc.clientWidth-P_MARGIN &&
    y-h/2>P_MARGIN &&
    y+h/2<pc.clientHeight-P_MARGIN
  );
}

function pickPraisePosition(w,h){
  const pc=document.getElementById("pc");
  const origin=getPraiseOrigin();
  const lanes=getLanes(origin);
  const free=lanes.filter(l=>!busyLanes.has(l.index));
  const pool=shuffle(free.length?free:lanes);

  for(const lane of pool){
    const minD=88;
    const maxD=Math.max(minD+20,Math.min(lane.len-54,340));

    for(let i=0;i<9;i++){
      const d=minD+Math.random()*(maxD-minD);
      const p=getPointOnLane(origin,lane,d);

      if(fitsInPraiseArea(p.x,p.y,w,h)){
        return{lane,x:p.x,y:p.y,angle:lane.angle};
      }
    }
  }

  const fb=pool[0]||lanes[0]||{index:0,angle:-90};
  const p=getPointOnLane(origin,fb,150);

  return{
    lane:fb,
    x:clamp(p.x,w/2+P_MARGIN,pc.clientWidth-w/2-P_MARGIN),
    y:clamp(p.y,h/2+P_MARGIN,pc.clientHeight-h/2-P_MARGIN),
    angle:fb.angle
  };
}

function spawnPraise(mode="input",forcedItem=null){
  if(livePraise>=MAX_PRAISE)return false;

  syncViewport();

  const pc=document.getElementById("pc");
  if(!pc)return false;

  const item=forcedItem||rnd(mode==="done"?DONE_PR:mode==="add"?ADD_PR:PR);
  const groups=grps(item.t);
  const fs=textSize(mode);
  const box=getTextBox(groups,fs);
  const pos=pickPraisePosition(box.w,box.h);
  const rot=clamp(pos.angle+90,-34,34);

  busyLanes.add(pos.lane.index);
  livePraise++;

  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",box.w);
  svg.setAttribute("height",box.h);
  svg.setAttribute("viewBox","0 0 "+box.w+" "+box.h);
  svg.style.cssText=
    "position:absolute;" +
    "left:"+(pos.x-box.w/2).toFixed(1)+"px;" +
    "top:"+(pos.y-box.h/2).toFixed(1)+"px;" +
    "transform:rotate("+rot.toFixed(1)+"deg) scale(.96);" +
    "opacity:0;" +
    "pointer-events:none;" +
    "filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));";

  drawPraiseText(svg,item,groups,box,fs);
  pc.appendChild(svg);
  activePraise.add(svg);

  const scale=mode==="input"?1:1.06;

  const anim=svg.animate(
    [
      {opacity:0,transform:"rotate("+rot.toFixed(1)+"deg) translateY(8px) scale(.9)"},
      {opacity:1,transform:"rotate("+rot.toFixed(1)+"deg) translateY(0) scale("+scale+")",offset:.12},
      {opacity:1,transform:"rotate("+rot.toFixed(1)+"deg) translateY(-8px) scale(1)",offset:.78},
      {opacity:0,transform:"rotate("+rot.toFixed(1)+"deg) translateY(-18px) scale(.96)"}
    ],
    {duration:PRAISE_LIFE,easing:"cubic-bezier(.18,.8,.22,1)",fill:"forwards"}
  );

  anim.onfinish=()=>releasePraise(svg,pos.lane.index);
  return true;
}

function releasePraise(svg,laneIndex){
  if(!activePraise.has(svg))return;

  activePraise.delete(svg);
  busyLanes.delete(laneIndex);
  livePraise=Math.max(0,livePraise-1);

  if(svg.parentNode)svg.parentNode.removeChild(svg);

  if(praiseQueue>0)drainPraiseQueue();
}

/* 1文字1回: 入力数ぶんキューに積んで順番に出す */
function enqueuePraise(amount){
  if(amount<=0)return;
  praiseQueue=clamp(praiseQueue+amount,0,MAX_PRAISE_QUEUE);
  drainPraiseQueue();
}

function drainPraiseQueue(){
  if(praiseDrainTimer)return;

  const run=()=>{
    praiseDrainTimer=null;

    if(praiseQueue<=0)return;

    if(livePraise>=MAX_PRAISE){
      praiseDrainTimer=setTimeout(run,140);
      return;
    }

    praiseQueue--;
    spawnPraise("input");

    if(praiseQueue>0){
      praiseDrainTimer=setTimeout(run,PRAISE_COOLDOWN);
    }
  };

  run();
}

function clearPraiseQueue(){
  praiseQueue=0;
  if(praiseDrainTimer){
    clearTimeout(praiseDrainTimer);
    praiseDrainTimer=null;
  }
}

function updateInputButtons(v){
  const db=document.getElementById("db");
  const ib=document.getElementById("ib");

  db.style.opacity=v?"1":".4";
  ib.style.color=v?"#00ffcc":"#6070a0";
  ib.style.borderColor=v?"#00ffcc55":"#2a2a50";
}

function resetPraiseInput(){
  observedLen=charLen(rawValue());
  compBaseLen=observedLen;
  compText="";
  clearPraiseQueue();
}

function observeTypingLength(len){
  if(len<observedLen){
    if(!isComposing)observedLen=len;
    return;
  }

  if(len>observedLen){
    enqueuePraise(len-observedLen);
    observedLen=len;
  }
}

function onBeforeInput(e){
  syncViewport();

  if(!isComposing){
    setTimeout(()=>observeTypingLength(charLen(rawValue())),0);
  }
}

function onCompStart(){
  syncViewport();
  isComposing=true;
  compBaseLen=charLen(rawValue());
  observedLen=compBaseLen;
  compText="";
}

function onCompUpdate(e){
  syncViewport();

  compText=e&&typeof e.data==="string"?e.data:"";
  observeTypingLength(compBaseLen+charLen(compText));
  updateInputButtons(rawValue().trim()||compText);
}

function onCompEnd(e){
  syncViewport();

  isComposing=false;
  compText="";

  observeTypingLength(charLen(rawValue()));
  updateInputButtons(vl());
}

function onIn(e){
  syncViewport();

  const raw=rawValue();
  updateInputButtons(raw.trim());

  if(!raw&&!isComposing){
    resetPraiseInput();
    return;
  }

  if(isComposing||(e&&e.isComposing))return;

  observeTypingLength(charLen(raw));
}

function onInputFocus(){
  setTimeout(()=>{
    initBaseViewport(false);
    syncViewport();
    resetPraiseInput();
  },40);

  setTimeout(syncViewport,120);
  setTimeout(syncViewport,260);
  setTimeout(syncViewport,520);
}

function onInputBlur(){
  setTimeout(()=>{
    initBaseViewport(false);
    syncViewport();
  },120);
}

function onKey(e){
  if(e.key==="Enter"&&!isComposing){
    e.preventDefault();
    doInst();
  }
}

/* ===================================================================
   TASKS
=================================================================== */
function doInst(){
  const v=vl();
  if(v)addT(v,"add");
}

function doDopa(){
  const v=vl();
  if(!v)return;

  showDopaonMessage(v);
  addT(v,"add");
}

function addT(name,praiseMode){
  state.tasks.unshift({
    id:newId(),
    name,
    state:"idle"
  });

  document.getElementById("mi").value="";
  updateInputButtons("");
  resetPraiseInput();

  render();
  saveState();

  const ta=document.getElementById("ta");
  if(ta)ta.scrollTop=0;

  if(praiseMode)setTimeout(()=>spawnPraise(praiseMode),80);
}

function tap(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!t)return;

  if(t.state==="idle"){
    t.state="charging";
    saveState();
    render();
  }else if(t.state==="charging"){
    t.state="done";
    saveState();
    render();

    setTimeout(()=>spawnPraise("done"),60);
    setTimeout(runReward,260);
  }
}

function render(){
  const a=document.getElementById("ta");
  a.innerHTML="";

  if(!state.tasks.length){
    a.innerHTML='<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">タスクを入力して追加しよう</div></div>';
    return;
  }

  const act=state.tasks.filter(t=>t.state!=="done");
  const done=state.tasks.filter(t=>t.state==="done");

  act.forEach((t,i)=>{
    const c=mkC(t);
    if(i===0)c.classList.add("tnew");
    a.appendChild(c);
  });

  if(done.length){
    const s=document.createElement("div");
    s.className="completed";
    s.innerHTML="<p>COMPLETED "+done.length+"</p>";
    a.appendChild(s);

    done.forEach(t=>a.appendChild(mkC(t)));
  }
}

function mkC(task){
  const iC=task.state==="charging";
  const iD=task.state==="done";

  const el=document.createElement("div");
  el.className="task"+(iC?" charging":"")+(iD?" done":"");

  const nm=document.createElement("span");
  nm.className="task-name";
  nm.textContent=task.name;
  el.appendChild(nm);

  if(!iD){
    const w=document.createElement("div");
    w.className="task-action";

    const b=document.createElement("button");
    b.className="task-btn"+(iC?" cbtn":"");
    b.onclick=()=>tap(task.id);
    b.setAttribute("aria-label",iC?"完了確定":"チャージ開始");
    b.innerHTML=iC
      ? '<span style="font-family:\'Orbitron\',monospace;font-size:7px;font-weight:700;">確定</span>'
      : '<span style="font-size:17px;">✓</span>';

    w.appendChild(b);

    if(iC){
      const h=document.createElement("span");
      h.className="push";
      h.textContent="PUSH";
      w.appendChild(h);
    }

    el.appendChild(w);
  }else{
    const ic=document.createElement("span");
    ic.className="done-mark";
    ic.textContent="✓";
    el.appendChild(ic);
  }

  return el;
}

/* ---------- viewport listeners ---------- */
function handleViewportChange(){
  syncViewport();
  setTimeout(syncViewport,60);
  setTimeout(syncViewport,180);
}

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",handleViewportChange);
  window.visualViewport.addEventListener("scroll",handleViewportChange);
}

window.addEventListener("resize",()=>{
  initBaseViewport(false);
  syncViewport();
});

window.addEventListener("orientationchange",()=>{
  setTimeout(()=>{
    initBaseViewport(true);
    syncViewport();
  },300);

  setTimeout(syncViewport,700);
});

window.addEventListener("scroll",lockScroll,{passive:true});

document.addEventListener("touchmove",e=>{
  if(e.target.closest("#ta"))return;
  if(e.target.closest(".popup"))return;
  e.preventDefault();
},{passive:false});

/* ---------- boot ---------- */
loadState();
initBaseViewport(true);
syncViewport();
renderHeader();
render();
</script>
